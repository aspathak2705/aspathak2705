<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26D9F3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF3045" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.8" />
    </linearGradient>
    <style>
      @keyframes portalPulse {
        0% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 0.6; transform: scale(1); }
      }
      .anim-portal { animation: portalPulse 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#080C14" />
  
  <!-- EMBEDDED OFFICIAL ANIMATED REFERENCE BACKGROUND -->
  <g opacity="0.45" class="anim-portal">
    <image href="../reference/Across The Spider-Verse Wallpaper.svg" x="0" y="-100" width="1600" height="900" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- OVERLAY FRAME & KINETIC TYPOGRAPHY -->
  <rect x="20" y="20" width="1560" height="660" fill="none" stroke="#F2EEE6" stroke-width="4" />
  
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="360" height="35" fill="#FF3045" stroke="#080C14" stroke-width="2" />
    <text x="180" y="23" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">EARTH-2705 // MULTIVERSE NODE ACTIVE</text>
  </g>

  <!-- TIER 1 HERO DISPLAY TYPOGRAPHY -->
  <g transform="translate(800, 320) skewX(-6)">
    <text x="-8" y="-6" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" text-anchor="middle" fill="#26D9F3" opacity="0.75">ATHARVA PATHAK</text>
    <text x="10" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" text-anchor="middle" fill="#FF3045">ATHARVA PATHAK</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" text-anchor="middle" fill="#F2EEE6">ATHARVA PATHAK</text>
  </g>

  <!-- SUBTITLE TAGLINE -->
  <g transform="translate(800, 470)">
    <rect x="-240" y="-30" width="480" height="60" fill="#FFD34E" stroke="#080C14" stroke-width="3" />
    <text x="0" y="10" font-family="'Impact', sans-serif" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#080C14">★ AI ENGINEER ★</text>
  </g>

  <g transform="translate(800, 580)">
    <rect x="-420" y="-35" width="840" height="70" fill="#080C14" stroke="#F2EEE6" stroke-width="2" />
    <text x="0" y="8" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#26D9F3" text-anchor="middle" letter-spacing="2">"Building systems that retrieve, reason, connect, and act."</text>
  </g>
</svg>
