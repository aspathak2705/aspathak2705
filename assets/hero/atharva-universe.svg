<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="40%" stop-color="#0D111C" />
      <stop offset="75%" stop-color="#1A0F2B" />
      <stop offset="100%" stop-color="#2B0A1E" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#26D9F3" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FF3045" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#7C4DFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <pattern id="halftoneDot" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#26D9F3" fill-opacity="0.15" />
      <circle cx="8" cy="8" r="1.5" fill="#FF3045" fill-opacity="0.15" />
    </pattern>

    <clipPath id="heroReferenceClip">
      <polygon points="1200,100 1560,100 1560,500 1200,500" />
    </clipPath>
  </defs>

  <!-- Base Sky & Atmosphere -->
  <rect width="1600" height="1000" fill="url(#skyGrad)" />
  <rect width="1600" height="1000" fill="url(#portalGlow)" />
  <rect width="1600" height="1000" fill="url(#halftoneDot)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#F2EEE6" stroke-width="4" />
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#FF3045" stroke-width="1.5" opacity="0.7" />

  <!-- TOP HEADER LABEL -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="380" height="40" fill="#FF3045" stroke="#070B14" stroke-width="2" />
    <text x="190" y="25" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">EARTH-2705 // MULTIVERSE NODE ACTIVE</text>
  </g>

  <!-- EMBEDDED OFFICIAL SPIDER-VERSE REFERENCE ARTWORK (TOP RIGHT ACTION INTEGRATION) -->
  <g clip-path="url(#heroReferenceClip)" opacity="0.85">
    <image href="../reference/Across The Spider-Verse Wallpaper.svg" x="1100" y="80" width="500" height="500" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- CENTER DYNAMIC TYPOGRAPHY COVER POSTER (TIER 1 DISPLAY TYPOGRAPHY) -->
  <g transform="translate(750, 440) skewX(-8)">
    <text x="-12" y="-10" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#26D9F3" opacity="0.75">ATHARVA</text>
    <text x="-12" y="130" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#26D9F3" opacity="0.75">PATHAK</text>

    <text x="14" y="12" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#FF3045">ATHARVA</text>
    <text x="14" y="152" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#FF3045">PATHAK</text>

    <text x="4" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#070B14">ATHARVA</text>
    <text x="4" y="144" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#070B14">PATHAK</text>

    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#F2EEE6">ATHARVA</text>
    <text x="0" y="140" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#F2EEE6">PATHAK</text>
  </g>

  <!-- SUBTITLE DESIGNATION CARD -->
  <g transform="translate(750, 680) rotate(-2)">
    <rect x="-260" y="-35" width="520" height="70" fill="#FFD34E" stroke="#070B14" stroke-width="4" />
    <text x="0" y="12" font-family="'Impact', 'Arial Narrow', sans-serif" font-size="42" font-weight="900" letter-spacing="6" text-anchor="middle" fill="#070B14">★ AI ENGINEER ★</text>
  </g>

  <!-- NARRATIVE TAGLINE BANNER BOX -->
  <g transform="translate(750, 800)">
    <rect x="-440" y="-45" width="880" height="90" fill="#070B14" stroke="#F2EEE6" stroke-width="3" />
    <rect x="-432" y="-37" width="864" height="74" fill="none" stroke="#26D9F3" stroke-width="1.5" />
    <text x="0" y="-8" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#26D9F3" text-anchor="middle" letter-spacing="2">"BUILDING SYSTEMS THAT DON'T JUST ANSWER —"</text>
    <text x="0" y="22" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="2">THEY RETRIEVE. REASON. CONNECT. AND ACT.</text>
  </g>

  <!-- SCENE TRANSITION ARROW -->
  <g transform="translate(750, 930)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FF3045" text-anchor="middle" letter-spacing="4">ORIGIN STORY BEGINS ↓</text>
  </g>
</svg>
