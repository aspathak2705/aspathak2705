<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" width="100%" height="100%">
  <defs>
    <!-- SUNSET ATMOSPHERIC GRADIENTS (WARM GOLDEN HOUR TO EVENING PURPLE) -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D112C" />
      <stop offset="35%" stop-color="#6B1D38" />
      <stop offset="65%" stop-color="#C83E34" />
      <stop offset="85%" stop-color="#E86A33" />
      <stop offset="100%" stop-color="#F2A154" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F2A154" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E86A33" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2D112C" stop-opacity="0" />
    </radialGradient>

    <pattern id="warmHalftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#F2A154" fill-opacity="0.25" />
      <circle cx="8" cy="8" r="1.5" fill="#E86A33" fill-opacity="0.2" />
    </pattern>

    <clipPath id="heroArtworkClip">
      <polygon points="900,40 1560,40 1560,710 820,710" />
    </clipPath>
  </defs>

  <!-- Base Sunset Atmosphere -->
  <rect width="1600" height="750" fill="url(#sunsetSky)" />
  <rect width="1600" height="750" fill="url(#sunGlow)" />
  <rect width="1600" height="750" fill="url(#warmHalftone)" />

  <!-- GOLDEN HOUR SPIDER-VERSE ARTWORK EMBEDDED -->
  <g clip-path="url(#heroArtworkClip)" opacity="0.9">
    <image href="../reference/Across The Spider-Verse Wallpaper.svg" x="700" y="-80" width="950" height="900" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- COMIC ISSUE HEADER METADATA -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="380" height="42" fill="#E86A33" stroke="#2D112C" stroke-width="3" />
    <text x="190" y="27" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">ISSUE #01 // THE ENGINEER BEHIND THE WEB</text>
  </g>

  <!-- HUGE GOLDEN-HOUR DIMENSIONAL COMIC TYPOGRAPHY -->
  <g transform="translate(80, 240) skewX(-8)">
    <text x="10" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#6B1D38">ATHARVA</text>
    <text x="-6" y="-6" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#F2A154">ATHARVA</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#F5F1E8">ATHARVA</text>

    <text x="10" y="140" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#6B1D38">PATHAK</text>
    <text x="-6" y="124" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#F2A154">PATHAK</text>
    <text x="0" y="130" font-family="'Impact', 'Arial Black', sans-serif" font-size="130" font-weight="900" letter-spacing="10" fill="#F5F1E8">PATHAK</text>
  </g>

  <!-- SUBTITLE DESIGNATION -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="480" height="55" fill="#F2A154" stroke="#2D112C" stroke-width="3" />
    <text x="240" y="37" font-family="'Impact', sans-serif" font-size="30" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#2D112C">★ AI ENGINEER ★</text>
  </g>

  <!-- NARRATIVE TAGLINE & COMIC QUOTE -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="760" height="75" fill="#2D112C" stroke="#F5F1E8" stroke-width="2" />
    <text x="25" y="32" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F2A154">BUILDING INTELLIGENT SYSTEMS THAT REMEMBER, REASON &amp; ACT.</text>
    <text x="25" y="58" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8" font-style="italic">"With great curiosity comes great responsibility."</text>
  </g>
</svg>
