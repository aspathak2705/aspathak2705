<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="c02_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0F1420" />
    </linearGradient>

    <pattern id="c02_halftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20D9FF" fill-opacity="0.15" />
      <circle cx="7" cy="7" r="1.2" fill="#F02B35" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#c02_bg)" />
  <rect width="1600" height="900" fill="url(#c02_halftone)" />

  <!-- Incoming Transition Thread from Scene 01 -->
  <path d="M 1320,0 Q 1200,150 1100,300" fill="none" stroke="#20D9FF" stroke-width="3" stroke-dasharray="8,4" opacity="0.8" />
  <path d="M 350,0 Q 250,100 150,220" fill="none" stroke="#F02B35" stroke-width="2" opacity="0.8" />

  <!-- SECTION HEADER: CHAPTER / SCENE LABEL -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="220" height="40" fill="#F02B35" stroke="#090B10" stroke-width="2" />
    <text x="110" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">SCENE 02 // INTRO</text>
  </g>

  <!-- PANEL 1: ORIGIN CAPTION BOX (Top Left Panel) -->
  <g transform="translate(70, 110)">
    <!-- Comic Panel Border -->
    <polygon points="0,0 680,0 640,320 0,320" fill="#090B10" stroke="#F5F1E8" stroke-width="4" />
    <polygon points="10,10 665,10 630,310 10,310" fill="none" stroke="#F02B35" stroke-width="1.5" />
    
    <!-- Yellow Caption Box -->
    <rect x="30" y="30" width="480" height="60" fill="#FFD23F" stroke="#090B10" stroke-width="3" />
    <text x="45" y="66" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#090B10" letter-spacing="1">"EVERY UNIVERSE HAS SOMEONE WHO..."</text>

    <!-- Caption Narrative Lines -->
    <text x="40" y="140" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#F5F1E8">"...starts by asking too many questions.</text>
    <text x="40" y="175" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#F5F1E8">How do machines learn?</text>
    <text x="40" y="210" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#20D9FF">How do systems retrieve context?</text>
    <text x="40" y="245" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#F02B35">And how do agents act in real workflows?"</text>

    <!-- Annotation Scribble -->
    <text x="40" y="290" font-family="'Courier New', monospace" font-size="14" fill="#8B949E" font-style="italic">// curiosity was the first bug</text>
  </g>

  <!-- PANEL 2: THE THOUGHT BUBBLE (Top Right Diagonal Panel) -->
  <g transform="translate(760, 90)">
    <polygon points="40,0 760,0 790,340 0,340" fill="#090B10" stroke="#20D9FF" stroke-width="4" />
    
    <!-- Thought Bubble Visual Shape -->
    <g transform="translate(380, 160)">
      <!-- Cloud Shapes -->
      <path d="M -220,-20 Q -240,-80 -160,-90 Q -100,-130 0,-90 Q 80,-130 160,-80 Q 240,-70 200,0 Q 240,70 160,80 Q 80,120 0,80 Q -100,120 -160,70 Q -240,60 -220,-20 Z" 
            fill="#F5F1E8" stroke="#090B10" stroke-width="4" />
      
      <!-- Speech Text inside bubble -->
      <text x="0" y="-30" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#090B10" text-anchor="middle" letter-spacing="1">WHAT IF MACHINES</text>
      <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#F02B35" text-anchor="middle" letter-spacing="1">COULD UNDERSTAND</text>
      <text x="0" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#090B10" text-anchor="middle" letter-spacing="1">MORE THAN WORDS?</text>
    </g>

    <!-- Little Thought Circles leading down -->
    <circle cx="280" cy="290" r="16" fill="#F5F1E8" stroke="#090B10" stroke-width="3" />
    <circle cx="230" cy="320" r="10" fill="#F5F1E8" stroke="#090B10" stroke-width="2" />
  </g>

  <!-- PANEL 3: REVEAL & SPECIALIZATION FRAGMENTS (Bottom Large Banner Panel) -->
  <g transform="translate(70, 470)">
    <polygon points="0,0 1460,0 1420,380 0,380" fill="#090B10" stroke="#F5F1E8" stroke-width="5" />
    <polygon points="10,10 1445,10 1410,370 10,370" fill="none" stroke="#7B2CFF" stroke-width="2" />

    <!-- Left Protagonist ID Card -->
    <g transform="translate(50, 40)">
      <rect x="0" y="0" width="420" height="280" fill="#0F1420" stroke="#20D9FF" stroke-width="3" />
      <rect x="0" y="0" width="420" height="40" fill="#20D9FF" />
      <text x="210" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#090B10" text-anchor="middle" letter-spacing="2">PROTAGONIST IDENTIFICATION</text>
      
      <text x="30" y="80" font-family="'Courier New', monospace" font-size="16" fill="#8B949E">NAME:</text>
      <text x="140" y="80" font-family="'Impact', sans-serif" font-size="24" fill="#F5F1E8" letter-spacing="1">ATHARVA PATHAK</text>
      
      <text x="30" y="125" font-family="'Courier New', monospace" font-size="16" fill="#8B949E">DESIGNATION:</text>
      <text x="170" y="125" font-family="'Impact', sans-serif" font-size="22" fill="#F02B35" letter-spacing="1">AI ENGINEER</text>

      <text x="30" y="170" font-family="'Courier New', monospace" font-size="16" fill="#8B949E">UNIVERSE:</text>
      <text x="140" y="170" font-family="'Courier New', monospace" font-size="18" fill="#FFD23F" font-weight="700">EARTH-AI-2705</text>

      <text x="30" y="215" font-family="'Courier New', monospace" font-size="16" fill="#8B949E">STATUS:</text>
      <text x="140" y="215" font-family="'Courier New', monospace" font-size="16" fill="#20D9FF" font-weight="700">BUILDING IN PRODUCTION</text>

      <rect x="30" y="235" width="360" height="25" fill="#F02B35" opacity="0.2" />
      <text x="40" y="252" font-family="'Courier New', monospace" font-size="12" fill="#F5F1E8">// CLEARANCE LEVEL: AGENTIC MULTIVERSE</text>
    </g>

    <!-- Right Integrated Focus Cards (Comic Speech & Spec Boxes) -->
    <g transform="translate(520, 50)">
      <text x="0" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#FFD23F" letter-spacing="2">CORE TACTICAL FOCUS:</text>

      <!-- Spec Box 1 -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="410" height="80" fill="#090B10" stroke="#F02B35" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#F02B35">01 // AI AGENTS &amp; LANGGRAPH</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">Multi-agent orchestration &amp; stateful graphs</text>
      </g>

      <!-- Spec Box 2 -->
      <g transform="translate(440, 50)">
        <rect x="0" y="0" width="410" height="80" fill="#090B10" stroke="#20D9FF" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#20D9FF">02 // RAG &amp; VECTOR SEARCH</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">Retrieval-augmented knowledge engines</text>
      </g>

      <!-- Spec Box 3 -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="410" height="80" fill="#090B10" stroke="#7B2CFF" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#7B2CFF">03 // KNOWLEDGE INTELLIGENCE</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">Evidence graphs &amp; document intelligence</text>
      </g>

      <!-- Spec Box 4 -->
      <g transform="translate(440, 150)">
        <rect x="0" y="0" width="410" height="80" fill="#090B10" stroke="#FFD23F" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#FFD23F">04 // PRODUCTION AI SYSTEMS</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">FastAPI, Docker, Redis &amp; Cloud Infra</text>
      </g>
    </g>
  </g>

  <!-- Bottom Transition Fragment (Exiting towards Scene 03) -->
  <polygon points="1200,850 1400,830 1350,900" fill="#7B2CFF" opacity="0.6" />
</svg>
