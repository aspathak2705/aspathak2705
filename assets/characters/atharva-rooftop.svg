<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rooftopSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#1A0F2B" />
      <stop offset="100%" stop-color="#FF3045" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#rooftopSky)" />

  <!-- NEON MULTIVERSE CITY IN DISTANCE -->
  <g fill="#080C14" opacity="0.9">
    <rect x="50" y="250" width="100" height="350" stroke="#26D9FF" stroke-width="1" />
    <rect x="180" y="180" width="140" height="420" stroke="#FF3045" stroke-width="1" />
    <rect x="350" y="220" width="110" height="380" stroke="#7C3AED" stroke-width="1" />
    <rect x="500" y="150" width="160" height="450" stroke="#FFD54A" stroke-width="1" />
  </g>

  <!-- FOREGROUND ROOFTOP LEDGE GEOMETRY -->
  <polygon points="0,480 800,480 800,600 0,600" fill="#080C14" stroke="#F2EEE6" stroke-width="3" />

  <!-- HERO CROUCHING ON ROOFTOP EDGE LOOKING OVER CITY -->
  <g transform="translate(620, 480)">
    <g transform="translate(-10, -6)" opacity="0.7">
      <path d="M -50,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -50,-120 Z" fill="#26D9FF" />
      <path d="M -100,-30 L -30,-90 L 40,-70 L 90,0 L 50,90 L -50,110 Z" fill="#26D9FF" />
    </g>

    <g transform="translate(10, 6)" opacity="0.7">
      <path d="M -50,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -50,-120 Z" fill="#FF3045" />
      <path d="M -100,-30 L -30,-90 L 40,-70 L 90,0 L 50,90 L -50,110 Z" fill="#FF3045" />
    </g>

    <!-- Main Silhouette -->
    <path d="M -50,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -50,-120 Z" fill="#080C14" />
    <polygon points="-40,-80 0,-75 -15,-65 -45,-70" fill="#26D9FF" />

    <path d="M -100,-30 L -30,-90 L 40,-70 L 90,0 L 50,90 L -50,110 Z" fill="#080C14" />
    <!-- Crouched Limbs & Sneaker on Ledge -->
    <path d="M -50,110 L -120,150 L -60,180 L -10,130 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="2" />
    <path d="M 50,90 L 120,140 L 70,170 L 20,120 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="2" />
  </g>

  <!-- PORTALS FLOATING ABOVE CITY -->
  <circle cx="150" cy="180" r="35" fill="none" stroke="#26D9FF" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="300" cy="120" r="40" fill="none" stroke="#FF3045" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="450" cy="160" r="35" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="600" cy="100" r="30" fill="none" stroke="#FFD54A" stroke-width="2" stroke-dasharray="4,2" />
</svg>
