<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="upsideSky" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#1A0F2B" />
      <stop offset="100%" stop-color="#26D9FF" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#upsideSky)" />

  <!-- INVERTED CITY SILHOUETTES IN BACKGROUND -->
  <g fill="#080C14" opacity="0.85" transform="rotate(180 400 400)">
    <rect x="100" y="100" width="120" height="400" stroke="#FF3045" stroke-width="1.5" />
    <rect x="260" y="50" width="160" height="500" stroke="#26D9FF" stroke-width="1.5" />
    <rect x="460" y="180" width="140" height="350" stroke="#7C3AED" stroke-width="1.5" />
  </g>

  <!-- WEB THREAD HANGING FROM TOP -->
  <line x1="400" y1="0" x2="400" y2="420" stroke="#F2EEE6" stroke-width="3" />
  <line x1="400" y1="0" x2="400" y2="420" stroke="#26D9FF" stroke-width="6" opacity="0.3" />

  <!-- HANGING UPSIDE-DOWN HERO CHARACTER SILHOUETTE -->
  <g transform="translate(400, 420) rotate(180)">
    <!-- Cyan Rim Light -->
    <g transform="translate(-8, -6)" opacity="0.7">
      <path d="M -40,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -40,-120 Z" fill="#26D9FF" />
      <path d="M -90,-20 L -30,-90 L 40,-70 L 100,0 L 60,110 L -40,140 Z" fill="#26D9FF" />
    </g>

    <!-- Red Rim Light -->
    <g transform="translate(8, 6)" opacity="0.7">
      <path d="M -40,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -40,-120 Z" fill="#FF3045" />
      <path d="M -90,-20 L -30,-90 L 40,-70 L 100,0 L 60,110 L -40,140 Z" fill="#FF3045" />
    </g>

    <!-- Main Black Silhouette -->
    <!-- Head / Mask looking at inverted city -->
    <path d="M -40,-120 C -70,-110 -80,-30 -20,0 C 0,5 30,-10 20,-70 C 10,-120 -20,-130 -40,-120 Z" fill="#080C14" />
    <polygon points="-30,-80 10,-75 -5,-65 -35,-70" fill="#26D9FF" />

    <!-- Torso Hoodie Hanging upside-down -->
    <path d="M -90,-20 L -30,-90 L 40,-70 L 100,0 L 60,110 L -40,140 Z" fill="#080C14" />

    <!-- Legs wrapped around hanging web thread -->
    <path d="M -40,140 L -90,220 L -40,290 L 10,210 Z" fill="#080C14" />
    <path d="M -90,220 L -140,280 L -80,310 L -40,290 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="3" />

    <path d="M 60,110 L 110,200 L 60,280 L 10,190 Z" fill="#080C14" />
    <path d="M 110,200 L 160,260 L 100,290 L 60,280 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="3" />
  </g>

  <g transform="translate(400, 680)">
    <rect x="-240" y="-25" width="480" height="50" fill="#080C14" stroke="#FFD54A" stroke-width="2" />
    <text x="0" y="8" font-family="'Courier New', monospace" font-size="16" fill="#FFD54A" font-weight="900" text-anchor="middle">"CHANGING PERSPECTIVE ON SYSTEM DESIGN."</text>
  </g>
</svg>
