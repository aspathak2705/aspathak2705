<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="runBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#runBg)" />

  <!-- DYNAMIC FORWARD MULTIVERSE RUNNING SILHOUETTE -->
  <g transform="translate(400, 300)">
    <g transform="translate(-10, -6)" opacity="0.7">
      <path d="M -80,-140 C -110,-130 -120,-40 -50,-10 C -30,-5 20,-20 10,-90 C 0,-140 -50,-150 -80,-140 Z" fill="#26D9FF" />
      <path d="M -150,-20 L -60,-100 L 40,-70 L 120,20 L 70,160 L -80,190 Z" fill="#26D9FF" />
    </g>

    <g transform="translate(10, 6)" opacity="0.7">
      <path d="M -80,-140 C -110,-130 -120,-40 -50,-10 C -30,-5 20,-20 10,-90 C 0,-140 -50,-150 -80,-140 Z" fill="#FF3045" />
      <path d="M -150,-20 L -60,-100 L 40,-70 L 120,20 L 70,160 L -80,190 Z" fill="#FF3045" />
    </g>

    <!-- Main Silhouette Body -->
    <path d="M -80,-140 C -110,-130 -120,-40 -50,-10 C -30,-5 20,-20 10,-90 C 0,-140 -50,-150 -80,-140 Z" fill="#080C14" />
    <polygon points="-70,-100 -20,-95 -35,-85 -65,-90" fill="#26D9FF" />

    <path d="M -150,-20 L -60,-100 L 40,-70 L 120,20 L 70,160 L -80,190 Z" fill="#080C14" />

    <!-- Running Arms -->
    <path d="M -150,-20 L -240,40 L -200,80 L -120,20 Z" fill="#080C14" stroke="#FF3045" stroke-width="2" />
    <path d="M 40,-70 L 140,-130 L 180,-80 L 80,-30 Z" fill="#080C14" stroke="#26D9FF" stroke-width="2" />

    <!-- Running Stranded Legs -->
    <path d="M -80,190 L -180,240 L -140,300 L -40,240 Z" fill="#080C14" />
    <path d="M -180,240 L -240,280 L -190,320 L -140,300 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="3" />

    <path d="M 70,160 L 180,220 L 140,280 L 40,200 Z" fill="#080C14" />
    <path d="M 180,220 L 250,250 L 200,290 L 140,280 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="3" />
  </g>
</svg>
