<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="leapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#140B1D" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#leapBg)" />

  <!-- MOTION VECTOR LINES -->
  <line x1="100" y1="500" x2="700" y2="100" stroke="#26D9FF" stroke-width="3" stroke-dasharray="10,5" />
  <line x1="100" y1="500" x2="700" y2="100" stroke="#FF3045" stroke-width="1.5" />

  <!-- DYNAMIC ACTION LEAPING HERO SILHOUETTE -->
  <g transform="translate(400, 300) rotate(-40)">
    <g transform="translate(-10, -6)" opacity="0.7">
      <path d="M -120,-30 C -140,-100 -60,-120 10,-80 C 70,-50 130,-10 200,60 L 130,120 L -30,40 Z" fill="#26D9FF" />
    </g>

    <g transform="translate(10, 6)" opacity="0.7">
      <path d="M -120,-30 C -140,-100 -60,-120 10,-80 C 70,-50 130,-10 200,60 L 130,120 L -30,40 Z" fill="#FF3045" />
    </g>

    <!-- Main Silhouette -->
    <path d="M -120,-30 C -140,-100 -60,-120 10,-80 C 70,-50 130,-10 200,60 L 130,120 L -30,40 Z" fill="#080C14" />
    <path d="M -120,-70 C -160,-80 -140,-140 -80,-120 C -40,-100 -60,-50 -120,-70 Z" fill="#080C14" />
    <polygon points="-120,-100 -80,-95 -90,-85 -125,-90" fill="#26D9FF" />

    <!-- Extended Arms & Legs -->
    <path d="M -120,-30 L -220,-110 L -180,-140 L -80,-50 Z" fill="#080C14" stroke="#FF3045" stroke-width="2" />
    <path d="M 130,120 L 230,190 L 190,240 L 90,160 Z" fill="#080C14" />
    <path d="M 230,190 L 290,230 L 250,260 L 190,240 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="3" />
  </g>
</svg>
