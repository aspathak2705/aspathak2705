<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="heroPortalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3045" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#26D9FF" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#7C3AED" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <pattern id="heroHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#26D9FF" fill-opacity="0.18" />
      <circle cx="7" cy="7" r="1.2" fill="#FF3045" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- PORTAL BACKDROP FRAME -->
  <circle cx="400" cy="400" r="320" fill="url(#heroPortalGlow)" />
  <circle cx="400" cy="400" r="320" fill="url(#heroHalftone)" />
  <circle cx="400" cy="400" r="280" fill="none" stroke="#26D9FF" stroke-width="3" stroke-dasharray="10,5" />
  <circle cx="400" cy="400" r="240" fill="none" stroke="#FF3045" stroke-width="2" />

  <!-- DYNAMIC COMIC SUPERHERO SILHOUETTE (ATHARVA PROTAGONIST IN CROUCH / PERSPECTIVE) -->
  <g transform="translate(400, 420)">
    <!-- Cyan Rim Light & Offset Shadow -->
    <g transform="translate(-10, -8)" opacity="0.8">
      <!-- Head Hood -->
      <path d="M -60,-170 C -90,-160 -100,-70 -30,-40 C -10,-35 40,-50 30,-120 C 20,-170 -30,-180 -60,-170 Z" fill="#26D9FF" />
      <!-- Torso Hoodie -->
      <path d="M -130,-50 L -40,-130 L 60,-100 L 140,-10 L 90,140 L -60,180 Z" fill="#26D9FF" />
      <!-- Limbs Foreshortened -->
      <path d="M -160,0 L -90,40 L -140,160 L -210,120 Z" fill="#26D9FF" />
      <path d="M 90,120 L 180,180 L 160,260 L 60,200 Z" fill="#26D9FF" />
    </g>

    <!-- Red Rim Light & Accent Offset Shadow -->
    <g transform="translate(10, 8)" opacity="0.8">
      <path d="M -60,-170 C -90,-160 -100,-70 -30,-40 C -10,-35 40,-50 30,-120 C 20,-170 -30,-180 -60,-170 Z" fill="#FF3045" />
      <path d="M -130,-50 L -40,-130 L 60,-100 L 140,-10 L 90,140 L -60,180 Z" fill="#FF3045" />
      <path d="M -160,0 L -90,40 L -140,160 L -210,120 Z" fill="#FF3045" />
      <path d="M 90,120 L 180,180 L 160,260 L 60,200 Z" fill="#FF3045" />
    </g>

    <!-- Base Black Superhero Body Silhouette -->
    <!-- Head / Hooded Mask -->
    <path d="M -60,-170 C -90,-160 -100,-70 -30,-40 C -10,-35 40,-50 30,-120 C 20,-170 -30,-180 -60,-170 Z" fill="#080C14" />
    <!-- Visor Eye Glint -->
    <polygon points="-40,-120 10,-115 -10,-100 -50,-105" fill="#26D9FF" />
    
    <!-- Torso Hoodie & Jacket Movement -->
    <path d="M -130,-50 L -40,-130 L 60,-100 L 140,-10 L 90,140 L -60,180 Z" fill="#080C14" />
    <!-- Jacket Flap / Motion Trail -->
    <path d="M -130,-50 L -190,-110 L -150,-20 Z" fill="#FF3045" />
    <path d="M 140,-10 L 210,-40 L 170,40 Z" fill="#7C3AED" />

    <!-- AI Chest Emblem (A + Neural Graph Node) -->
    <g transform="translate(-5, -30)">
      <polygon points="0,-35 25,25 -25,25" fill="#FF3045" />
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#F2EEE6" stroke-width="3" />
      <circle cx="0" cy="-35" r="5" fill="#26D9FF" />
      <circle cx="-25" cy="25" r="5" fill="#26D9FF" />
      <circle cx="25" cy="25" r="5" fill="#26D9FF" />
    </g>

    <!-- Foreshortened Lead Arm Interacting with AI Elements -->
    <path d="M -130,-50 L -210,-10 L -180,50 L -100,20 Z" fill="#080C14" stroke="#FF3045" stroke-width="2" />
    <polygon points="-210,-10 -240,-30 -220,10" fill="#26D9FF" />

    <!-- Trailing Dynamic Arm -->
    <path d="M 60,-100 L 150,-130 L 180,-70 L 110,-40 Z" fill="#080C14" stroke="#26D9FF" stroke-width="2" />

    <!-- Crouched Legs & Comic Sneakers -->
    <path d="M -60,180 L -150,220 L -120,290 L -30,240 Z" fill="#080C14" />
    <!-- Left Sneaker -->
    <path d="M -150,290 L -210,320 L -140,340 L -90,300 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="3" />

    <path d="M 90,140 L 160,200 L 130,280 L 40,220 Z" fill="#080C14" />
    <!-- Right Sneaker -->
    <path d="M 130,280 L 180,340 L 240,330 L 160,290 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="3" />
  </g>

  <!-- FLOATING COMIC HUD SPEECH & TECH NODES -->
  <g transform="translate(620, 200)">
    <rect x="0" y="0" width="140" height="35" fill="#080C14" stroke="#FF3045" stroke-width="2" />
    <text x="70" y="22" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FF3045" text-anchor="middle">LLMs • RAG</text>
  </g>

  <g transform="translate(70, 520)">
    <rect x="0" y="0" width="160" height="35" fill="#080C14" stroke="#26D9FF" stroke-width="2" />
    <text x="80" y="22" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#26D9FF" text-anchor="middle">LANGGRAPH</text>
  </g>

  <g transform="translate(560, 600)">
    <rect x="0" y="0" width="180" height="35" fill="#080C14" stroke="#FFD54A" stroke-width="2" />
    <text x="90" y="22" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FFD54A" text-anchor="middle">AGENTIC AI</text>
  </g>
</svg>
