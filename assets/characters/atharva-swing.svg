<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="swingTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26D9FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF3045" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- SWING MOTION WEB THREADS & STREAKS -->
  <path d="M 50,-50 Q 300,150 700,500" fill="none" stroke="url(#swingTrail)" stroke-width="6" />
  <path d="M 50,-50 Q 300,150 700,500" fill="none" stroke="#F2EEE6" stroke-width="2" stroke-dasharray="8,4" />

  <!-- DYNAMIC SWINGING HERO CHARACTER SILHOUETTE (EXTENDED BODY LEAP) -->
  <g transform="translate(420, 260) rotate(-25)">
    <!-- Cyan Chromatic Shadow -->
    <g transform="translate(-12, -8)" opacity="0.7">
      <path d="M -140,-40 C -160,-120 -80,-140 0,-100 C 60,-70 120,-30 200,40 L 140,110 L -40,30 Z" fill="#26D9FF" />
      <path d="M -140,-40 L -240,-120 L -180,-140 Z" fill="#26D9FF" />
      <path d="M 200,40 L 300,120 L 260,180 L 140,110 Z" fill="#26D9FF" />
    </g>

    <!-- Red Chromatic Shadow -->
    <g transform="translate(12, 8)" opacity="0.7">
      <path d="M -140,-40 C -160,-120 -80,-140 0,-100 C 60,-70 120,-30 200,40 L 140,110 L -40,30 Z" fill="#FF3045" />
      <path d="M -140,-40 L -240,-120 L -180,-140 Z" fill="#FF3045" />
      <path d="M 200,40 L 300,120 L 260,180 L 140,110 Z" fill="#FF3045" />
    </g>

    <!-- Main Silhouette Body -->
    <!-- Extended Stretched Torso Hoodie -->
    <path d="M -140,-40 C -160,-120 -80,-140 0,-100 C 60,-70 120,-30 200,40 L 140,110 L -40,30 Z" fill="#080C14" />
    <!-- Hooded Mask Head -->
    <path d="M -140,-80 C -180,-90 -160,-150 -100,-130 C -60,-110 -80,-60 -140,-80 Z" fill="#080C14" />
    <polygon points="-140,-110 -100,-105 -110,-95 -145,-100" fill="#26D9FF" />

    <!-- Leading Reaching Arm Upward -->
    <path d="M -140,-40 L -250,-130 L -210,-160 L -100,-70 Z" fill="#080C14" stroke="#FF3045" stroke-width="2" />

    <!-- Trailing Dynamic Arm -->
    <path d="M 0,-100 L 80,-170 L 120,-130 L 40,-70 Z" fill="#080C14" stroke="#26D9FF" stroke-width="2" />

    <!-- Trailing Bent Legs with Comic Sneakers -->
    <path d="M 140,110 L 250,180 L 210,240 L 100,170 Z" fill="#080C14" />
    <!-- Lead Sneaker -->
    <path d="M 250,180 L 320,220 L 280,260 L 210,240 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="3" />

    <path d="M 40,30 L 120,120 L 80,170 L -10,80 Z" fill="#080C14" />
    <!-- Tucked Sneaker -->
    <path d="M 120,120 L 160,180 L 110,200 L 80,170 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="3" />
  </g>

  <!-- ACTION BURST GRAPHIC TEXT -->
  <g transform="translate(180, 160) rotate(-15)">
    <polygon points="-50,-25 50,-25 60,25 -40,25" fill="#FFD54A" stroke="#080C14" stroke-width="3" />
    <text x="5" y="8" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#080C14" text-anchor="middle">THWIP!</text>
  </g>
</svg>
