<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F1424" />
    </linearGradient>

    <pattern id="chartDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20D9F3" fill-opacity="0.15" />
      <circle cx="8" cy="8" r="1.2" fill="#FF3045" fill-opacity="0.15" />
    </pattern>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20D9F3" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#20D9F3" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="450" fill="url(#chartBg)" />
  <rect width="1200" height="450" fill="url(#chartDots)" />
  <rect x="20" y="20" width="1160" height="410" fill="none" stroke="#F2EEE6" stroke-width="4" />
  <rect x="30" y="30" width="1140" height="390" fill="none" stroke="#FF3045" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="480" height="40" fill="#FF3045" stroke="#080C14" stroke-width="2" />
    <text x="240" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">DIMENSIONAL FOOTPRINTS // MULTIVERSE SIGNAL</text>
  </g>

  <!-- GRAPH GRID LINES -->
  <g stroke="#20D9F3" stroke-width="0.5" opacity="0.2">
    <line x1="60" y1="120" x2="1140" y2="120" />
    <line x1="60" y1="180" x2="1140" y2="180" />
    <line x1="60" y1="240" x2="1140" y2="240" />
    <line x1="60" y1="300" x2="1140" y2="300" />
    <line x1="60" y1="360" x2="1140" y2="360" />
  </g>

  <!-- ACTIVITY SIGNAL WAVE PATH -->
  <polygon points="60,360 60,280 140,310 220,240 300,290 380,180 460,220 540,150 620,210 700,130 780,190 860,110 940,160 1020,90 1100,140 1140,120 1140,360" fill="url(#areaGrad)" />
  <path d="M 60,280 L 140,310 L 220,240 L 300,290 L 380,180 L 460,220 L 540,150 L 620,210 L 700,130 L 780,190 L 860,110 L 940,160 L 1020,90 L 1100,140 L 1140,120" fill="none" stroke="#20D9F3" stroke-width="3.5" />

  <!-- SECONDARY RED PEAK LINE -->
  <path d="M 60,320 L 140,300 L 220,260 L 300,310 L 380,220 L 460,240 L 540,170 L 620,230 L 700,160 L 780,220 L 860,140 L 940,190 L 1020,110 L 1100,160 L 1140,140" fill="none" stroke="#FF3045" stroke-width="2" stroke-dasharray="6,3" />

  <!-- SIGNAL PEAK DATA NODES -->
  <g fill="#FFD34E">
    <circle cx="380" cy="180" r="5" stroke="#080C14" stroke-width="2" />
    <circle cx="540" cy="150" r="5" stroke="#080C14" stroke-width="2" />
    <circle cx="700" cy="130" r="5" stroke="#080C14" stroke-width="2" />
    <circle cx="860" cy="110" r="5" stroke="#080C14" stroke-width="2" />
    <circle cx="1020" cy="90" r="6" stroke="#080C14" stroke-width="2" />
  </g>

  <!-- METRIC BADGES AT BOTTOM -->
  <g transform="translate(60, 375)" font-family="'Courier New', monospace" font-size="13" font-weight="700">
    <text x="40" y="20" fill="#20D9F3">AI AGENTS</text>
    <text x="240" y="20" fill="#FF3045">FINANCIAL INTELLIGENCE</text>
    <text x="540" y="20" fill="#7C4DFF">DOCUMENT RAG</text>
    <text x="800" y="20" fill="#FFD34E">CODE REPOSITORY COPILOT</text>
  </g>
</svg>
