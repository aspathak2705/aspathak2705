<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D112C" />
      <stop offset="100%" stop-color="#1A0A1F" />
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#p2Grad)" />

  <!-- DETECTIVE PAPER / EVIDENCE INVESTIGATION BOARD THEME FOR BHOOMIFLOW -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="1520" height="420" fill="#1A0A1F" stroke="#F5B041" stroke-width="4" rx="12" />

    <!-- UNIVERSE TITLE -->
    <rect x="40" y="25" width="500" height="60" fill="#F5B041" stroke="#1A0A1F" stroke-width="2" rx="4" />
    <text x="65" y="65" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="#1A0A1F" letter-spacing="3">UNIVERSE 02 // BHOOMIFLOW</text>

    <!-- NARRATIVE TAGLINE & DESCRIPTION -->
    <g transform="translate(40, 110)">
      <text x="0" y="25" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#E86A33">"Documents don't just contain data. They contain stories."</text>
      
      <g font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8" transform="translate(0, 50)">
        <text x="0" y="0">Land case &amp; evidence intelligence graph platform parsing legal document RAG,</text>
        <text x="0" y="25">conflict detection, procedure integrity, and officer workflow intelligence.</text>
      </g>

      <!-- EVIDENCE CALLOUT LIST -->
      <g transform="translate(0, 120)" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">
        <circle cx="10" cy="0" r="4" fill="#F5B041" />
        <text x="25" y="4">Legal Document RAG &amp; Multi-Page Evidence Extraction</text>

        <circle cx="10" cy="30" r="4" fill="#E86A33" />
        <text x="25" y="34">Land Conflict Intelligence &amp; Officer Workflow Graph</text>

        <circle cx="10" cy="60" r="4" fill="#F5F1E8" />
        <text x="25" y="64">Procedure Verification Engine</text>
      </g>
    </g>

    <!-- RIGHT EVIDENCE GRAPH BOARD VISUAL -->
    <g transform="translate(860, 45)">
      <rect x="0" y="0" width="580" height="330" fill="#54152B" stroke="#F5B041" stroke-width="2" rx="10" />
      
      <!-- Evidence Strings -->
      <line x1="120" y1="80" x2="300" y2="180" stroke="#F5B041" stroke-width="3" stroke-dasharray="6,4" />
      <line x1="300" y1="180" x2="480" y2="100" stroke="#E86A33" stroke-width="3" stroke-dasharray="6,4" />
      
      <rect x="70" y="60" width="100" height="45" fill="#1A0A1F" stroke="#F5B041" stroke-width="2" rx="4" />
      <text x="120" y="87" font-family="'Courier New', monospace" font-size="12" fill="#F5F1E8" text-anchor="middle">LEGAL DOCS</text>

      <rect x="230" y="150" width="140" height="50" fill="#1A0A1F" stroke="#E86A33" stroke-width="2" rx="4" />
      <text x="300" y="180" font-family="'Courier New', monospace" font-size="13" fill="#F5B041" font-weight="900" text-anchor="middle">EVIDENCE GRAPH</text>

      <rect x="430" y="80" width="100" height="45" fill="#1A0A1F" stroke="#F5F1E8" stroke-width="2" rx="4" />
      <text x="480" y="107" font-family="'Courier New', monospace" font-size="12" fill="#F5F1E8" text-anchor="middle">OFFICER RAG</text>

      <!-- TECH TAG BADGES -->
      <g transform="translate(30, 270)" font-family="'Courier New', monospace" font-size="12" fill="#F5F1E8">
        <rect x="0" y="0" width="110" height="30" fill="#1A0A1F" stroke="#F5B041" stroke-width="1.5" rx="3" />
        <text x="55" y="20" text-anchor="middle">PYTHON</text>

        <rect x="125" y="0" width="130" height="30" fill="#1A0A1F" stroke="#E86A33" stroke-width="1.5" rx="3" />
        <text x="190" y="20" text-anchor="middle">FASTAPI</text>

        <rect x="270" y="0" width="130" height="30" fill="#1A0A1F" stroke="#F5B041" stroke-width="1.5" rx="3" />
        <text x="335" y="20" text-anchor="middle">LEGAL RAG</text>

        <rect x="415" y="0" width="110" height="30" fill="#1A0A1F" stroke="#F5F1E8" stroke-width="1.5" rx="3" />
        <text x="470" y="20" text-anchor="middle">GRAPH AI</text>
      </g>
    </g>
  </g>
</svg>
