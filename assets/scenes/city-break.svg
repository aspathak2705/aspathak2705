<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sb_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#1A0F2B" />
      <stop offset="70%" stop-color="#3B112C" />
      <stop offset="100%" stop-color="#5C162E" />
    </linearGradient>

    <clipPath id="cityBreakClip">
      <rect x="0" y="0" width="1560" height="440" />
    </clipPath>
  </defs>

  <rect width="1600" height="480" fill="url(#sb_bg)" />

  <!-- EMBEDDED OFFICIAL SPIDER-VERSE CITY SUNSET REFERENCE ARTWORK FROM assets/reference/ -->
  <g transform="translate(20, 20)" opacity="0.35" clip-path="url(#cityBreakClip)">
    <image href="../reference/Spider Man_ Across The Spider Verse Wallpaper.svg" x="0" y="-150" width="1560" height="700" preserveAspectRatio="xMidYMid slice" />
  </g>

  <rect x="20" y="20" width="1560" height="440" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <!-- CENTER CALM CINEMATIC TEXT -->
  <g transform="translate(800, 220)">
    <rect x="-420" y="-45" width="840" height="90" fill="#080C14" opacity="0.9" stroke="#FFD34E" stroke-width="3" />
    <text x="0" y="-8" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#26D9F3" text-anchor="middle" letter-spacing="3">"SOMETIMES YOU HAVE TO STOP BUILDING..."</text>
    <text x="0" y="24" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="4">...TO SEE HOW FAR THE UNIVERSE GOES.</text>
  </g>
</svg>
