<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sb_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="40%" stop-color="#1A0F2B" />
      <stop offset="70%" stop-color="#3B112C" />
      <stop offset="100%" stop-color="#5C162E" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#FFD54A" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FF3040" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#sb_bg)" />
  <rect width="1600" height="480" fill="url(#sunGlow)" />
  <rect x="20" y="20" width="1560" height="440" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- SILHOUETTE SKYLINE BREATHING SPACE -->
  <g fill="#070B14" opacity="0.9">
    <rect x="100" y="280" width="120" height="200" />
    <rect x="240" y="220" width="160" height="260" />
    <rect x="420" y="320" width="100" height="160" />
    <rect x="1080" y="250" width="140" height="230" />
    <rect x="1240" y="180" width="180" height="300" />
  </g>

  <!-- CENTER CALM CINEMATIC TEXT -->
  <g transform="translate(800, 220)">
    <rect x="-420" y="-45" width="840" height="90" fill="#070B14" stroke="#FFD54A" stroke-width="3" opacity="0.95" />
    <text x="0" y="-8" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#20D9FF" text-anchor="middle" letter-spacing="3">"SOMETIMES YOU HAVE TO STOP BUILDING..."</text>
    <text x="0" y="24" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#F5F2E8" text-anchor="middle" letter-spacing="4">...TO SEE HOW FAR THE UNIVERSE GOES.</text>
  </g>
</svg>
