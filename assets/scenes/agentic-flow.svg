<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0F1424" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <pattern id="flowDots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#26D9F3" fill-opacity="0.15" />
      <circle cx="9" cy="9" r="1.2" fill="#FF3045" fill-opacity="0.15" />
    </pattern>

    <style>
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -40;
        }
      }
      .animated-pipeline {
        stroke-dasharray: 10, 5;
        animation: dashFlow 2s linear infinite;
      }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#flowBg)" />
  <rect width="1600" height="1000" fill="url(#flowDots)" />
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="380" height="40" fill="#26D9F3" stroke="#070B14" stroke-width="2" />
    <text x="190" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#070B14" text-anchor="middle" letter-spacing="3">SCENE 05 // HOW THE MIND WORKS</text>
  </g>

  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="580" height="45" fill="#070B14" stroke="#FF3045" stroke-width="2" />
    <text x="20" y="28" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#F2EEE6">AGENTIC AI PHILOSOPHY // SYSTEM EXECUTION PIPELINE</text>
  </g>

  <!-- ========================================================= -->
  <!-- VERTICAL KINETIC COMIC-TECH EXECUTION FLOW WITH ANIMATED PIPELINE -->
  <!-- ========================================================= -->

  <g transform="translate(800, 210)">
    <!-- Central Energy Pipeline with SVG Dash Motion Animation -->
    <line x1="0" y1="0" x2="0" y2="600" stroke="#26D9F3" stroke-width="4" />
    <line x1="0" y1="0" x2="0" y2="600" class="animated-pipeline" stroke="#FF3045" stroke-width="2.5" />

    <!-- STAGE 1: QUESTION (INPUT SPEECH BUBBLE) -->
    <g transform="translate(0, 20)">
      <polygon points="-260,-40 260,-40 280,20 240,50 -260,50" fill="#070B14" stroke="#F2EEE6" stroke-width="3" />
      <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="24" fill="#FFD34E" text-anchor="middle" letter-spacing="2">01 // THE QUESTION (INPUT)</text>
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="15" fill="#F2EEE6" text-anchor="middle">Complex query, unstructured context, ambiguous user intent</text>
    </g>

    <!-- STAGE 2: CONTEXT & VECTOR RETRIEVAL -->
    <g transform="translate(0, 150)">
      <g transform="translate(-320, 0)">
        <polygon points="-180,-30 180,-30 160,30 -180,30" fill="#070B14" stroke="#26D9F3" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#26D9F3" text-anchor="middle">02A // CONTEXT HARVEST</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F2EEE6" text-anchor="middle">Documents, legal graphs, evidence</text>
      </g>
      
      <g transform="translate(320, 0)">
        <polygon points="-180,-30 180,-30 180,30 -160,30" fill="#070B14" stroke="#26D9F3" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#26D9F3" text-anchor="middle">02B // VECTOR RETRIEVAL</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F2EEE6" text-anchor="middle">Dense embeddings &amp; hybrid search</text>
      </g>
    </g>

    <!-- STAGE 3: AGENTIC REASONING CORE -->
    <g transform="translate(0, 290)">
      <polygon points="-300,-45 300,-45 340,45 -300,45" fill="#070B14" stroke="#FF3045" stroke-width="4" />
      <polygon points="-290,-35 290,-35 325,35 -290,35" fill="none" stroke="#7C4DFF" stroke-width="2" />
      
      <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="28" fill="#FF3045" text-anchor="middle" letter-spacing="2">03 // AGENTIC REASONING &amp; ORCHESTRATION</text>
      <text x="0" y="22" font-family="'Courier New', monospace" font-size="16" fill="#F2EEE6" text-anchor="middle">LangGraph stateful execution nodes &amp; multi-agent decisioning</text>
    </g>

    <!-- STAGE 4: MEMORY & TOOLS -->
    <g transform="translate(0, 430)">
      <g transform="translate(-320, 0)">
        <polygon points="-180,-30 180,-30 160,30 -180,30" fill="#070B14" stroke="#7C4DFF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#7C4DFF" text-anchor="middle">04A // STATE &amp; MEMORY</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F2EEE6" text-anchor="middle">PostgreSQL &amp; Redis checkpoints</text>
      </g>
      
      <g transform="translate(320, 0)">
        <polygon points="-180,-30 180,-30 180,30 -160,30" fill="#070B14" stroke="#7C4DFF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#7C4DFF" text-anchor="middle">04B // TOOL EXECUTION</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F2EEE6" text-anchor="middle">APIs, databases &amp; web hooks</text>
      </g>
    </g>

    <!-- STAGE 5: REAL WORLD ACTION -->
    <g transform="translate(0, 570)">
      <polygon points="-340,-40 340,-40 360,40 -320,40" fill="#FFD34E" stroke="#070B14" stroke-width="4" />
      <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="28" fill="#070B14" text-anchor="middle" letter-spacing="2">05 // REAL-WORLD ACTION &amp; RESULT</text>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#070B14" text-anchor="middle">SYSTEMS THAT ACT BEYOND THE PROMPT</text>
    </g>
  </g>

  <!-- BOTTOM NARRATIVE BANNER BOX -->
  <g transform="translate(800, 890)">
    <rect x="-440" y="-35" width="880" height="70" fill="#070B14" stroke="#F2EEE6" stroke-width="3" />
    <rect x="-432" y="-27" width="864" height="54" fill="none" stroke="#26D9F3" stroke-width="1.5" />
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="17" font-weight="900" fill="#FF3045" text-anchor="middle">"I DON'T BUILD AI TO JUST GENERATE TEXT.</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="17" font-weight="900" fill="#F2EEE6" text-anchor="middle">I BUILD SYSTEMS THAT CAN DO SOMETHING WITH IT."</text>
  </g>
</svg>
