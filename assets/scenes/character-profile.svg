<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="dossierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#111728" />
    </linearGradient>

    <pattern id="halftoneSmall" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7C3AED" fill-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1600" height="750" fill="url(#dossierBg)" />
  <rect width="1600" height="750" fill="url(#halftoneSmall)" />
  <rect x="20" y="20" width="1560" height="710" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="280" height="40" fill="#7C3AED" stroke="#080C14" stroke-width="2" />
    <text x="140" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">SCENE 02 // PROTAGONIST FILE</text>
  </g>

  <!-- DOSSIER CARD CONTAINER -->
  <g transform="translate(60, 110)">
    <polygon points="0,0 1480,0 1440,580 0,580" fill="#080C14" stroke="#26D9FF" stroke-width="4" />
    <polygon points="10,10 1465,10 1430,570 10,570" fill="none" stroke="#FF3045" stroke-width="1.5" />

    <!-- LEFT SIDE: DYNAMIC SPIDER-VERSE HERO CHARACTER SILHOUETTE (ATHARVA HERO) -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="460" height="490" fill="#0D1117" stroke="#7C3AED" stroke-width="3" />
      
      <!-- PORTAL BACKDROP -->
      <circle cx="230" cy="220" r="170" fill="none" stroke="#26D9FF" stroke-width="3" stroke-dasharray="8,4" />
      <circle cx="230" cy="220" r="140" fill="#FF3045" opacity="0.15" />

      <!-- DYNAMIC HERO SILHOUETTE IN CROUCH / PERSPECTIVE WITH SNEAKERS & HOODIE -->
      <g transform="translate(230, 220)">
        <!-- Cyan Rim Light & Offset Shadow -->
        <g transform="translate(-8, -6)" opacity="0.7">
          <path d="M -50,-140 C -70,-130 -80,-60 -20,-30 C 0,-25 30,-35 20,-90 C 15,-130 -20,-145 -50,-140 Z" fill="#26D9FF" />
          <path d="M -100,-40 L -30,-100 L 40,-70 L 100,-10 L 70,110 L -40,140 Z" fill="#26D9FF" />
        </g>

        <!-- Red Rim Light & Accent Shadow -->
        <g transform="translate(8, 6)" opacity="0.7">
          <path d="M -50,-140 C -70,-130 -80,-60 -20,-30 C 0,-25 30,-35 20,-90 C 15,-130 -20,-145 -50,-140 Z" fill="#FF3045" />
          <path d="M -100,-40 L -30,-100 L 40,-70 L 100,-10 L 70,110 L -40,140 Z" fill="#FF3045" />
        </g>

        <!-- Main Superhero Silhouette Body -->
        <path d="M -50,-140 C -70,-130 -80,-60 -20,-30 C 0,-25 30,-35 20,-90 C 15,-130 -20,-145 -50,-140 Z" fill="#080C14" />
        <polygon points="-35,-95 5,-90 -10,-80 -40,-85" fill="#26D9FF" />

        <path d="M -100,-40 L -30,-100 L 40,-70 L 100,-10 L 70,110 L -40,140 Z" fill="#080C14" />

        <!-- AI Chest Emblem -->
        <polygon points="0,-25 20,20 -20,20" fill="#FF3045" />
        <circle cx="0" cy="-25" r="4" fill="#26D9FF" />

        <!-- Crouched Limbs & Sneakers -->
        <path d="M -40,140 L -110,170 L -80,230 L -20,180 Z" fill="#080C14" />
        <path d="M -110,170 L -160,200 L -100,220 L -60,190 Z" fill="#FF3045" stroke="#F2EEE6" stroke-width="2.5" />

        <path d="M 70,110 L 120,150 L 90,210 L 40,160 Z" fill="#080C14" />
        <path d="M 120,150 L 160,190 L 110,210 L 80,180 Z" fill="#26D9FF" stroke="#F2EEE6" stroke-width="2.5" />
      </g>

      <rect x="30" y="430" width="400" height="40" fill="#080C14" stroke="#FFD54A" stroke-width="2" />
      <text x="230" y="456" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FFD54A" text-anchor="middle">CLEARANCE LEVEL: AGENTIC MULTIVERSE</text>
    </g>

    <!-- RIGHT SIDE: CHARACTER DOSSIER SPECIFICATIONS -->
    <g transform="translate(540, 40)">
      <!-- Name Header -->
      <rect x="0" y="0" width="880" height="70" fill="#FF3045" stroke="#080C14" stroke-width="3" />
      <text x="30" y="48" font-family="'Impact', sans-serif" font-size="38" font-weight="900" fill="#F2EEE6" letter-spacing="3">ATHARVA PATHAK</text>
      <text x="700" y="45" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#FFD54A">[ EARTH-2705 ]</text>

      <!-- Spec Field 1: Role -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="880" height="55" fill="#0D1117" stroke="#26D9FF" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#26D9FF">DESIGNATION / ROLE:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="24" fill="#F2EEE6" letter-spacing="2">AI ENGINEER</text>
      </g>

      <!-- Spec Field 2: Specialization -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="880" height="55" fill="#0D1117" stroke="#7C3AED" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#7C3AED">SPECIALIZATION:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="22" fill="#FFD54A" letter-spacing="1">LLMs • RAG • AGENTIC AI SYSTEMS • LANGGRAPH</text>
      </g>

      <!-- Spec Field 3: Status -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="880" height="55" fill="#0D1117" stroke="#FFD54A" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFD54A">DEPLOYMENT STATUS:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="22" fill="#FF3045" letter-spacing="1">BUILDING INTELLIGENT SYSTEMS IN PRODUCTION</text>
      </g>

      <!-- Spec Field 4: Current Obsession -->
      <g transform="translate(0, 300)">
        <rect x="0" y="0" width="880" height="90" fill="#0D1117" stroke="#F2EEE6" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F2EEE6">CURRENT OBSESSION:</text>
        <text x="25" y="65" font-family="'Courier New', monospace" font-size="15" fill="#26D9FF">"Designing multi-agent systems that retain long-term memory, reason over complex evidence, and solve real-world problems beyond the prompt."</text>
      </g>

      <!-- Glitch Annotation Line -->
      <g transform="translate(0, 415)">
        <rect x="0" y="0" width="880" height="40" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="1" />
        <text x="20" y="26" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6" font-style="italic">// MULTIVERSE IDENTIFIER: aspathak2705 • ALL SYSTEMS OPERATIONAL</text>
      </g>
    </g>
  </g>
</svg>
