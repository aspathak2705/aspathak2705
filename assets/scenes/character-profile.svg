<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="100%" height="100%">
  <defs>
    <linearGradient id="powerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D112C" />
      <stop offset="60%" stop-color="#6B1D38" />
      <stop offset="100%" stop-color="#2D112C" />
    </linearGradient>

    <clipPath id="powerArtClip">
      <circle cx="240" cy="240" r="190" />
    </clipPath>
  </defs>

  <rect width="1600" height="550" fill="url(#powerBg)" />
  <rect x="20" y="20" width="1560" height="510" fill="none" stroke="#F5F1E8" stroke-width="4" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="220" height="38" fill="#E86A33" stroke="#2D112C" stroke-width="2" />
    <text x="110" y="24" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">THE POWER SET</text>
  </g>

  <!-- LEFT EMBEDDED OFFICIAL SPIDER-MAN HOMECOMING ARTWORK IN PORTAL -->
  <g transform="translate(60, 100)">
    <circle cx="240" cy="240" r="195" fill="none" stroke="#F2A154" stroke-width="3" stroke-dasharray="8,4" />
    <g clip-path="url(#powerArtClip)" opacity="0.95">
      <image href="../reference/Spider-Man_ Homecoming Film Series Marvel Cinematic Universe Spider-Man_ Homecoming Film Series Marvel Studios PNG.svg" x="30" y="30" width="420" height="420" preserveAspectRatio="xMidYMid slice" />
    </g>
  </g>

  <!-- RIGHT SPIDER GADGET BLUEPRINT / POWERS GRID -->
  <g transform="translate(560, 90)">
    <!-- POWER 1: SPIDER-SENSE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="460" height="190" fill="#2D112C" stroke="#F2A154" stroke-width="2" />
      <text x="25" y="38" font-family="'Impact', sans-serif" font-size="22" fill="#F2A154" letter-spacing="2">SPIDER-SENSE // RETRIEVAL &amp; CONTEXT</text>
      <g transform="translate(25, 60)" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">
        <text x="0" y="20">→ Retrieval-Augmented Generation (RAG)</text>
        <text x="0" y="45">→ Context Understanding &amp; Evidence Parsing</text>
        <text x="0" y="70">→ Vector Search &amp; Dense Embeddings</text>
        <text x="0" y="95" fill="#E86A33" font-weight="700">Tech: Qdrant • PGVector • Embeddings</text>
      </g>
    </g>

    <!-- POWER 2: WEB-SHOOTERS -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="460" height="190" fill="#2D112C" stroke="#E86A33" stroke-width="2" />
      <text x="25" y="38" font-family="'Impact', sans-serif" font-size="22" fill="#E86A33" letter-spacing="2">WEB-SHOOTERS // AGENTIC WORKFLOWS</text>
      <g transform="translate(25, 60)" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">
        <text x="0" y="20">→ Stateful Multi-Agent Orchestration</text>
        <text x="0" y="45">→ Complex Execution Graphs &amp; Tool Access</text>
        <text x="0" y="70">→ Autonomous Workflow Reasoning</text>
        <text x="0" y="95" fill="#F2A154" font-weight="700">Tech: LangGraph • LangChain • Agents</text>
      </g>
    </g>

    <!-- POWER 3: MULTIVERSE NAVIGATION -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="460" height="190" fill="#2D112C" stroke="#6B1D38" stroke-width="2" />
      <text x="25" y="38" font-family="'Impact', sans-serif" font-size="22" fill="#F5F1E8" letter-spacing="2">MULTIVERSE NAVIGATION // LLM APPS</text>
      <g transform="translate(25, 60)" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">
        <text x="0" y="20">→ Large Language Models (LLMs)</text>
        <text x="0" y="45">→ Prompt Engineering &amp; Fine-tuning</text>
        <text x="0" y="70">→ Knowledge Graph Reasoning</text>
        <text x="0" y="95" fill="#E86A33" font-weight="700">Tech: PyTorch • Transformers • Ollama</text>
      </g>
    </g>

    <!-- POWER 4: CITY INFRASTRUCTURE -->
    <g transform="translate(490, 210)">
      <rect x="0" y="0" width="460" height="190" fill="#2D112C" stroke="#F2A154" stroke-width="2" />
      <text x="25" y="38" font-family="'Impact', sans-serif" font-size="22" fill="#F2A154" letter-spacing="2">CITY INFRASTRUCTURE // PRODUCTION</text>
      <g transform="translate(25, 60)" font-family="'Courier New', monospace" font-size="14" fill="#F5F1E8">
        <text x="0" y="20">→ High-Performance REST APIs</text>
        <text x="0" y="45">→ Production Containerization &amp; Deployment</text>
        <text x="0" y="70">→ Relational &amp; In-Memory Data Layers</text>
        <text x="0" y="95" fill="#E86A33" font-weight="700">Tech: Python • FastAPI • PostgreSQL • Docker</text>
      </g>
    </g>
  </g>
</svg>
