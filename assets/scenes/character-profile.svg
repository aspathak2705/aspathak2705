<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="dossierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#111728" />
    </linearGradient>

    <pattern id="halftoneSmall" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7C3AED" fill-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1600" height="750" fill="url(#dossierBg)" />
  <rect width="1600" height="750" fill="url(#halftoneSmall)" />
  <rect x="20" y="20" width="1560" height="710" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="280" height="40" fill="#7C3AED" stroke="#070B14" stroke-width="2" />
    <text x="140" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F2E8" text-anchor="middle" letter-spacing="3">SCENE 02 // PROTAGONIST FILE</text>
  </g>

  <!-- DOSSIER CARD CONTAINER -->
  <g transform="translate(60, 110)">
    <polygon points="0,0 1480,0 1440,580 0,580" fill="#070B14" stroke="#20D9FF" stroke-width="4" />
    <polygon points="10,10 1465,10 1430,570 10,570" fill="none" stroke="#FF3040" stroke-width="1.5" />

    <!-- LEFT SIDE: AVATAR / PORTAL ARTWORK -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="460" height="490" fill="#0F172A" stroke="#7C3AED" stroke-width="3" />
      
      <!-- Outer Dimensional Portal Rings -->
      <circle cx="230" cy="220" r="180" fill="none" stroke="#20D9FF" stroke-width="3" stroke-dasharray="8,4" />
      <circle cx="230" cy="220" r="150" fill="none" stroke="#FF3040" stroke-width="2" />
      <circle cx="230" cy="220" r="120" fill="#FF3040" opacity="0.15" />

      <!-- Original Stylized Character Avatar Silhouette (Hoodie & Cyberpunk Neon Edges) -->
      <g transform="translate(230, 220)">
        <!-- Head / Hood Silhouette -->
        <path d="M -50,100 C -70,20 -60,-60 0,-70 C 60,-60 70,20 50,100 Z" fill="#F5F2E8" />
        <path d="M -40,90 C -55,20 -45,-45 0,-55 C 45,-45 55,20 40,90 Z" fill="#070B14" />
        <!-- Cyan Visor Glow -->
        <polygon points="-30,-10 30,-10 20,5 -20,5" fill="#20D9FF" />
        <!-- Torso Hoodie -->
        <path d="M -90,180 L -50,90 L 50,90 L 90,180 Z" fill="#FF3040" />
      </g>

      <rect x="30" y="430" width="400" height="40" fill="#070B14" stroke="#FFD54A" stroke-width="2" />
      <text x="230" y="456" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FFD54A" text-anchor="middle">CLEARANCE LEVEL: AGENTIC MULTIVERSE</text>
    </g>

    <!-- RIGHT SIDE: CHARACTER DOSSIER SPECIFICATIONS -->
    <g transform="translate(540, 40)">
      <!-- Name Header -->
      <rect x="0" y="0" width="880" height="70" fill="#FF3040" stroke="#070B14" stroke-width="3" />
      <text x="30" y="48" font-family="'Impact', sans-serif" font-size="38" font-weight="900" fill="#F5F2E8" letter-spacing="3">ATHARVA PATHAK</text>
      <text x="700" y="45" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#FFD54A">[ EARTH-2705 ]</text>

      <!-- Spec Field 1: Role -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="880" height="55" fill="#0D111C" stroke="#20D9FF" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#20D9FF">DESIGNATION / ROLE:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="24" fill="#F5F2E8" letter-spacing="2">AI ENGINEER</text>
      </g>

      <!-- Spec Field 2: Specialization -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="880" height="55" fill="#0D111C" stroke="#7C3AED" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#7C3AED">SPECIALIZATION:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="22" fill="#FFD54A" letter-spacing="1">LLMs • RAG • AGENTIC AI SYSTEMS • LANGGRAPH</text>
      </g>

      <!-- Spec Field 3: Status -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="880" height="55" fill="#0D111C" stroke="#FFD54A" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFD54A">DEPLOYMENT STATUS:</text>
        <text x="260" y="35" font-family="'Impact', sans-serif" font-size="22" fill="#FF3040" letter-spacing="1">BUILDING INTELLIGENT SYSTEMS IN PRODUCTION</text>
      </g>

      <!-- Spec Field 4: Current Obsession -->
      <g transform="translate(0, 300)">
        <rect x="0" y="0" width="880" height="90" fill="#0D111C" stroke="#F5F2E8" stroke-width="2" />
        <text x="25" y="35" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F2E8">CURRENT OBSESSION:</text>
        <text x="25" y="65" font-family="'Courier New', monospace" font-size="15" fill="#20D9FF">"Designing multi-agent systems that retain long-term memory, reason over complex evidence, and solve real-world problems beyond the prompt."</text>
      </g>

      <!-- Glitch Annotation Line -->
      <g transform="translate(0, 415)">
        <rect x="0" y="0" width="880" height="40" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="1" />
        <text x="20" y="26" font-family="'Courier New', monospace" font-size="14" fill="#F5F2E8" font-style="italic">// MULTIVERSE IDENTIFIER: aspathak2705 • ALL SYSTEMS OPERATIONAL</text>
      </g>
    </g>
  </g>
</svg>
