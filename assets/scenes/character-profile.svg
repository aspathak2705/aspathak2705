<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="100%" height="100%">
  <defs>
    <style>
      @keyframes activeGlow {
        0% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; }
        100% { stroke-opacity: 0.4; }
      }
      .anim-glow { animation: activeGlow 3s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="1600" height="550" fill="#080C14" />
  
  <!-- EMBEDDED OFFICIAL SPIDER-MAN HOMECOMING PNG/SVG REFERENCE ARTWORK -->
  <g transform="translate(40, 40)" opacity="0.5">
    <image href="../reference/Spider-Man_ Homecoming Film Series Marvel Cinematic Universe Spider-Man_ Homecoming Film Series Marvel Studios PNG.svg" x="0" y="-60" width="520" height="520" preserveAspectRatio="xMidYMid slice" />
  </g>

  <rect x="20" y="20" width="1560" height="510" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="260" height="35" fill="#7C4DFF" stroke="#080C14" stroke-width="2" />
    <text x="130" y="23" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">SCENE 02 // THE BUILDER</text>
  </g>

  <!-- CONCISE BUILDER DOSSIER CARD WITH TIERED TYPOGRAPHY -->
  <g transform="translate(580, 70)">
    <rect x="0" y="0" width="940" height="410" fill="#0D1117" stroke="#26D9F3" stroke-width="3" class="anim-glow" />
    
    <!-- TIER 1 HERO NAME -->
    <text x="40" y="55" font-family="'Impact', sans-serif" font-size="38" font-weight="900" fill="#F2EEE6" letter-spacing="3">ATHARVA PATHAK</text>
    <text x="760" y="50" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFD34E">[ EARTH-2705 ]</text>

    <!-- TIER 2 & TIER 3 ESSENTIAL FIELDS -->
    <g transform="translate(40, 95)">
      <!-- Field 1: Role -->
      <rect x="0" y="0" width="860" height="50" fill="#080C14" stroke="#26D9F3" stroke-width="1.5" />
      <text x="20" y="32" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#26D9F3">ROLE:</text>
      <text x="220" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#F2EEE6" letter-spacing="2">AI ENGINEER</text>

      <!-- Field 2: Focus -->
      <rect x="0" y="65" width="860" height="50" fill="#080C14" stroke="#7C4DFF" stroke-width="1.5" />
      <text x="20" y="97" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#7C4DFF">FOCUS:</text>
      <text x="220" y="97" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#FFD34E">LLMs · RAG · AGENTIC SYSTEMS · LANGGRAPH</text>

      <!-- Field 3: Currently -->
      <rect x="0" y="130" width="860" height="50" fill="#080C14" stroke="#FFD34E" stroke-width="1.5" />
      <text x="20" y="162" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#FFD34E">CURRENTLY:</text>
      <text x="220" y="162" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#FF3045">BUILDING INTELLIGENT SYSTEMS THAT REASON BEYOND PROMPTS</text>

      <!-- TIER 4 READABLE BODY QUOTE -->
      <rect x="0" y="195" width="860" height="75" fill="#080C14" stroke="#F2EEE6" stroke-width="1.5" />
      <text x="20" y="225" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">"Designing multi-agent workflows that retain long-term memory, reason over complex evidence, and safely execute real-world actions."</text>
    </g>

    <text x="40" y="385" font-family="'Courier New', monospace" font-size="13" fill="#8B949E" font-style="italic">// MULTIVERSE IDENTIFIER: aspathak2705 • ALL SYSTEMS OPERATIONAL</text>
  </g>
</svg>
