<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="originSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D112C" />
      <stop offset="50%" stop-color="#6B1D38" />
      <stop offset="100%" stop-color="#C83E34" />
    </linearGradient>

    <pattern id="originDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#F2A154" fill-opacity="0.2" />
    </pattern>

    <clipPath id="originArtClip">
      <polygon points="40,90 680,90 640,580 40,580" />
    </clipPath>
  </defs>

  <rect width="1600" height="650" fill="url(#originSunset)" />
  <rect width="1600" height="650" fill="url(#originDots)" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="240" height="38" fill="#E86A33" stroke="#2D112C" stroke-width="2" />
    <text x="120" y="24" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">THE ORIGIN STORY</text>
  </g>

  <!-- LEFT EMBEDDED OFFICIAL SPIDER-MAN POSTER REFERENCE ARTWORK -->
  <g clip-path="url(#originArtClip)" opacity="0.95">
    <image href="../reference/Spider Man Into The Spider Verse Poster.svg" x="20" y="20" width="680" height="650" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- RIGHT COMIC NARRATION PANEL WITH SUNSET WARMTH -->
  <g transform="translate(700, 90)">
    <rect x="0" y="0" width="840" height="490" fill="#2D112C" stroke="#F2A154" stroke-width="3" />
    <rect x="10" y="10" width="820" height="470" fill="none" stroke="#E86A33" stroke-width="1.5" />

    <!-- TIER 2 ISSUE TITLE -->
    <text x="40" y="60" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#F2A154" letter-spacing="2">EVERY UNIVERSE STARTS WITH CURIOSITY.</text>

    <!-- TIER 4 COMIC NARRATION PARAGRAPHS -->
    <g font-family="'Courier New', monospace" font-size="16" fill="#F5F1E8">
      <text x="40" y="120">Mine started with a question:</text>
      <text x="40" y="160" font-weight="700" fill="#F2A154">"What if machines could understand context, reason through complex workflows,</text>
      <text x="40" y="190" font-weight="700" fill="#E86A33">and retrieve knowledge to assist human decisions in real time?"</text>

      <text x="40" y="260" fill="#D0C4DF">A question became an experiment.</text>
      <text x="40" y="290" fill="#D0C4DF">Experiments became production systems.</text>
      <text x="40" y="320" fill="#F2A154" font-weight="700">And somewhere along the way, I became an AI Engineer.</text>

      <text x="40" y="380" font-size="14" fill="#8B949E">// B.Tech Computer Science • LLMs • RAG • Agentic AI Systems</text>
    </g>

    <!-- SUNSET COMIC PUNCHLINE TAG -->
    <rect x="40" y="415" width="760" height="45" fill="#E86A33" stroke="#2D112C" stroke-width="2" />
    <text x="420" y="443" font-family="'Impact', sans-serif" font-size="20" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">"NOT ALL HEROES WEAR CAPES. SOME SHIP PRODUCTION AI SYSTEMS."</text>
  </g>
</svg>
