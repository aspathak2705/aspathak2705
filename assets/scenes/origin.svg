<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashAnim {
        to { stroke-dashoffset: -50; }
      }
      .anim-dash {
        stroke-dasharray: 12, 6;
        animation: dashAnim 2.5s linear infinite;
      }
    </style>
  </defs>

  <rect width="1600" height="650" fill="#080C14" />
  
  <!-- EMBEDDED OFFICIAL SPIDER-MAN POSTER REFERENCE ARTWORK -->
  <g transform="translate(40, 40)" opacity="0.45">
    <image href="../reference/Spider Man Into The Spider Verse Poster.svg" x="0" y="-80" width="600" height="650" preserveAspectRatio="xMidYMid slice" />
  </g>

  <rect x="20" y="20" width="1560" height="610" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="240" height="35" fill="#FF3045" stroke="#080C14" stroke-width="2" />
    <text x="120" y="23" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#F2EEE6" text-anchor="middle" letter-spacing="3">SCENE 01 // ORIGIN</text>
  </g>

  <!-- ANIMATED CONNECTOR LINE TO RIGHT NARRATIVE -->
  <line x1="640" y1="320" x2="720" y2="320" stroke="#26D9F3" stroke-width="3" class="anim-dash" />

  <!-- RIGHT NARRATIVE CARD WITH TIERED TYPOGRAPHY -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="820" height="450" fill="#0D1117" stroke="#26D9F3" stroke-width="3" />
    
    <!-- TIER 2 SCENE TITLE -->
    <text x="40" y="60" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#FFD34E" letter-spacing="2">EVERY UNIVERSE STARTS WITH CURIOSITY.</text>

    <!-- TIER 4 READABLE BODY PARAGRAPH -->
    <g font-family="'Courier New', monospace" font-size="16" fill="#F2EEE6">
      <text x="40" y="130">Mine became a central question:</text>
      <text x="40" y="180" font-weight="700" fill="#26D9F3">"What if machines could retrieve knowledge, reason over context,</text>
      <text x="40" y="210" font-weight="700" fill="#FF3045">and safely act in real-world workflows?"</text>
      
      <text x="40" y="290" fill="#8B949E">// From curiosity to production AI engineering</text>
      <text x="40" y="320" fill="#8B949E">// LLMs • RAG • LangGraph • Agentic Multi-Agent Systems</text>
    </g>

    <!-- PUNCHLINE TAG -->
    <rect x="40" y="370" width="740" height="45" fill="#FF3045" stroke="#080C14" stroke-width="2" />
    <text x="410" y="398" font-family="'Impact', sans-serif" font-size="20" fill="#F2EEE6" text-anchor="middle" letter-spacing="2">"NOT ALL HEROES WEAR CAPES. SOME SHIP PRODUCTION AI SYSTEMS."</text>
  </g>
</svg>
