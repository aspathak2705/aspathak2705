<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="100%" height="100%">
  <defs>
    <linearGradient id="s1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0F1424" />
    </linearGradient>

    <pattern id="s1_dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20D9FF" fill-opacity="0.15" />
      <circle cx="7" cy="7" r="1.2" fill="#FF3040" fill-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="1600" height="950" fill="url(#s1_bg)" />
  <rect width="1600" height="950" fill="url(#s1_dots)" />
  <rect x="20" y="20" width="1560" height="910" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="260" height="40" fill="#FF3040" stroke="#070B14" stroke-width="2" />
    <text x="130" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F2E8" text-anchor="middle" letter-spacing="3">SCENE 01 // ORIGIN STORY</text>
  </g>

  <!-- PANEL 1: TOP LEFT ASYMMETRICAL PANEL -->
  <g transform="translate(60, 110)">
    <polygon points="0,0 720,0 670,360 0,360" fill="#070B14" stroke="#F5F2E8" stroke-width="4" />
    <rect x="30" y="30" width="460" height="55" fill="#FFD54A" stroke="#070B14" stroke-width="3" />
    <text x="45" y="65" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#070B14" letter-spacing="1">"EVERY UNIVERSE HAS SOMEONE WHO..."</text>
    
    <text x="40" y="140" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#F5F2E8">"...starts by asking too many questions.</text>
    <text x="40" y="180" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#20D9FF">Why generate static answers when machines</text>
    <text x="40" y="220" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#FF3040">can retrieve, reason, and act?"</text>

    <text x="40" y="300" font-family="'Courier New', monospace" font-size="14" fill="#8B949E" font-style="italic">ORIGIN LOG // EARTH-2705 • NARRATOR 2019</text>
  </g>

  <!-- PANEL 2: TOP RIGHT THOUGHT BUBBLE PANEL -->
  <g transform="translate(800, 100)">
    <polygon points="40,0 740,0 740,370 0,370" fill="#070B14" stroke="#20D9FF" stroke-width="4" />
    
    <!-- Thought Bubble -->
    <g transform="translate(370, 170)">
      <path d="M -220,-20 Q -240,-80 -160,-90 Q -100,-130 0,-90 Q 80,-130 160,-80 Q 240,-70 200,0 Q 240,70 160,80 Q 80,120 0,80 Q -100,120 -160,70 Q -240,60 -220,-20 Z" 
            fill="#F5F2E8" stroke="#070B14" stroke-width="4" />
      <text x="0" y="-30" font-family="'Impact', sans-serif" font-size="26" font-weight="900" fill="#070B14" text-anchor="middle">WHAT IF MACHINES COULD</text>
      <text x="0" y="10" font-family="'Impact', sans-serif" font-size="26" font-weight="900" fill="#FF3040" text-anchor="middle">UNDERSTAND CONTEXT</text>
      <text x="0" y="50" font-family="'Impact', sans-serif" font-size="26" font-weight="900" fill="#070B14" text-anchor="middle">AND ACT ON EVIDENCE?</text>
    </g>
    <circle cx="270" cy="310" r="14" fill="#F5F2E8" stroke="#070B14" stroke-width="3" />
    <circle cx="220" cy="335" r="8" fill="#F5F2E8" stroke="#070B14" stroke-width="2" />
  </g>

  <!-- PANEL 3: BOTTOM FULL WIDE ARTWORK & SEQUENCE PANEL -->
  <g transform="translate(60, 500)">
    <polygon points="0,0 1480,0 1440,390 0,390" fill="#070B14" stroke="#F5F2E8" stroke-width="4" />
    <polygon points="10,10 1465,10 1430,380 10,380" fill="none" stroke="#7C3AED" stroke-width="2" />

    <!-- Left Visual Artwork: Silhouette sitting with laptop & floating code -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="460" height="300" fill="#0D111C" stroke="#20D9FF" stroke-width="2" />
      
      <!-- Developer Silhouette at Desk -->
      <polygon points="140,240 180,140 240,140 280,240" fill="#F5F2E8" opacity="0.9" />
      <circle cx="210" cy="110" r="25" fill="#F5F2E8" />
      <polygon points="170,240 250,240 270,200 150,200" fill="#FF3040" />
      <!-- Glowing Laptop Screen -->
      <polygon points="210,195 280,195 295,235 210,235" fill="#20D9FF" />
      
      <!-- Floating Neural Web Code Lines -->
      <g stroke="#20D9FF" stroke-width="1.5" opacity="0.7">
        <line x1="295" y1="210" x2="420" y2="120" stroke-dasharray="4,2" />
        <line x1="295" y1="210" x2="400" y2="250" />
        <circle cx="420" cy="120" r="4" fill="#FF3040" />
        <circle cx="400" cy="250" r="4" fill="#FFD54A" />
      </g>

      <text x="310" y="80" font-family="'Courier New', monospace" font-size="12" fill="#20D9FF">// python main.py</text>
      <text x="310" y="100" font-family="'Courier New', monospace" font-size="12" fill="#FF3040">// init langgraph</text>
      <text x="310" y="270" font-family="'Courier New', monospace" font-size="12" fill="#FFD54A">// neural web online</text>
    </g>

    <!-- Right Sequence Question Cards -->
    <g transform="translate(540, 40)">
      <!-- Question Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="420" height="80" fill="#070B14" stroke="#FF3040" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#FF3040">01 // HOW DO MACHINES LEARN?</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F2E8">From pattern matching to deep embeddings</text>
      </g>

      <!-- Question Card 2 -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="420" height="80" fill="#070B14" stroke="#20D9FF" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#20D9FF">02 // HOW DO SYSTEMS REMEMBER?</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F2E8">Vector search, state checkpoints &amp; RAG</text>
      </g>

      <!-- Question Card 3 -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="420" height="80" fill="#070B14" stroke="#7C3AED" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#7C3AED">03 // HOW DO AGENTS REASON?</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F2E8">Multi-agent orchestration &amp; execution graphs</text>
      </g>

      <!-- Question Card 4 -->
      <g transform="translate(460, 110)">
        <rect x="0" y="0" width="420" height="80" fill="#070B14" stroke="#FFD54A" stroke-width="2" />
        <text x="20" y="32" font-family="'Impact', sans-serif" font-size="22" fill="#FFD54A">04 // HOW DO AGENTS ACT?</text>
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F5F2E8">Real-world API integrations &amp; automated workflows</text>
      </g>

      <!-- Closing Narrative Banner -->
      <g transform="translate(0, 220)">
        <rect x="0" y="0" width="880" height="60" fill="#FF3040" stroke="#070B14" stroke-width="2" />
        <text x="440" y="36" font-family="'Impact', sans-serif" font-size="24" fill="#F5F2E8" text-anchor="middle" letter-spacing="2">"NOT ALL HEROES WEAR CAPES. SOME SHIP PRODUCTION AI SYSTEMS."</text>
      </g>
    </g>
  </g>
</svg>
