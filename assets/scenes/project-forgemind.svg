<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="p3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#140B1D" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#p3_bg)" />
  <rect x="20" y="20" width="1560" height="610" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <g transform="translate(40, 40)">
    <polygon points="0,0 1520,0 1460,570 0,570" fill="#080C14" stroke="#7C4DFF" stroke-width="5" />
    <polygon points="10,10 1505,10 1450,560 10,560" fill="none" stroke="#FFD34E" stroke-width="1.5" />

    <!-- LEVEL 1 HERO TITLE BADGE -->
    <rect x="40" y="30" width="500" height="60" fill="#7C4DFF" stroke="#080C14" stroke-width="3" />
    <text x="65" y="72" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="#F2EEE6" letter-spacing="3">UNIVERSE 03 // FORGEMIND</text>

    <!-- UNIVERSE SUBTITLE & TAGLINE -->
    <g transform="translate(40, 105)">
      <rect x="0" y="0" width="340" height="30" fill="#20D9F3" />
      <text x="15" y="20" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#080C14">DEVELOPER INTELLIGENCE UNIVERSE</text>

      <rect x="0" y="45" width="750" height="55" fill="#0D1117" stroke="#F2EEE6" stroke-width="1.5" />
      <text x="20" y="80" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#FF3045">"EVERY CODEBASE IS A CITY. SOMEONE HAS TO KNOW THE WAY."</text>
    </g>

    <!-- LEVEL 2 SECTION HEADING & LEVEL 3 BODY TEXT -->
    <g transform="translate(40, 225)">
      <text x="0" y="22" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#7C4DFF" letter-spacing="2">MISSION OBJECTIVE &amp; CORE ARCHITECTURE</text>
      
      <text x="0" y="55" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Open Source Maintainer Copilot &amp; Contributor Mentor helping developers parse</text>
      <text x="0" y="80" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">large codebases, triage open issues, and navigate repository structures.</text>

      <g transform="translate(0, 110)">
        <circle cx="12" cy="15" r="4" fill="#7C4DFF" />
        <text x="30" y="20" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Repository Intelligence &amp; Graph Search</text>

        <circle cx="12" cy="45" r="4" fill="#20D9F3" />
        <text x="30" y="50" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Automated Issue Analysis &amp; Contributor Guidance</text>

        <circle cx="12" cy="75" r="4" fill="#FFD34E" />
        <text x="30" y="80" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Multi-Agent Codebase Copilot</text>
      </g>
    </g>

    <!-- RIGHT SIDE: SIMPLIFIED VISUAL ARCHITECTURE -->
    <g transform="translate(850, 105)">
      <rect x="0" y="0" width="580" height="340" fill="#0D1117" stroke="#FFD34E" stroke-width="2" />
      
      <g opacity="0.9">
        <path d="M 60,170 Q 200,60 340,170 T 520,170" fill="none" stroke="#7C4DFF" stroke-width="3" />
        <path d="M 60,170 Q 200,280 340,170 T 520,170" fill="none" stroke="#20D9F3" stroke-width="2" />
        
        <circle cx="200" cy="115" r="16" fill="#FF3045" />
        <circle cx="340" cy="170" r="22" fill="#7C4DFF" />
        <circle cx="460" cy="115" r="16" fill="#FFD34E" />

        <text x="200" y="120" font-family="'Courier New', monospace" font-size="10" fill="#F2EEE6" font-weight="900" text-anchor="middle">PR</text>
        <text x="340" y="175" font-family="'Courier New', monospace" font-size="11" fill="#F2EEE6" font-weight="900" text-anchor="middle">AGENT</text>
      </g>

      <g transform="translate(30, 285)">
        <rect x="0" y="0" width="120" height="30" fill="#080C14" stroke="#7C4DFF" stroke-width="1.5" />
        <text x="60" y="20" font-family="'Courier New', monospace" font-size="12" fill="#7C4DFF" text-anchor="middle">MULTI-AGENT</text>

        <rect x="135" y="0" width="120" height="30" fill="#080C14" stroke="#20D9F3" stroke-width="1.5" />
        <text x="195" y="20" font-family="'Courier New', monospace" font-size="12" fill="#20D9F3" text-anchor="middle">LANGGRAPH</text>

        <rect x="270" y="0" width="110" height="30" fill="#080C14" stroke="#F2EEE6" stroke-width="1.5" />
        <text x="325" y="20" font-family="'Courier New', monospace" font-size="12" fill="#F2EEE6" text-anchor="middle">GITHUB API</text>

        <rect x="395" y="0" width="110" height="30" fill="#080C14" stroke="#FF3045" stroke-width="1.5" />
        <text x="450" y="20" font-family="'Courier New', monospace" font-size="12" fill="#FF3045" text-anchor="middle">FASTAPI</text>
      </g>
    </g>
  </g>
</svg>
