<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <radialGradient id="senseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B041" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E86A33" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A0A1F" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes sensePulse {
        0% { stroke-opacity: 0.3; transform: scale(1); }
        50% { stroke-opacity: 1; transform: scale(1.05); }
        100% { stroke-opacity: 0.3; transform: scale(1); }
      }
      .anim-sense-ring { animation: sensePulse 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <rect width="1600" height="650" fill="#1A0A1F" />
  <rect width="1600" height="650" fill="url(#senseGlow)" />

  <!-- SECTION TITLE -->
  <g transform="translate(60, 45)">
    <polygon points="0,0 340,0 320,40 0,40" fill="#E86A33" stroke="#F5F1E8" stroke-width="2" />
    <text x="160" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">SPIDER-SENSE // POWER SET</text>
  </g>

  <!-- CENTER FOCAL CHARACTER / SILHOUETTE WITH DANGER AWARENESS SENSE RINGS -->
  <g transform="translate(800, 320)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#F5B041" stroke-width="3" class="anim-sense-ring" stroke-dasharray="10,5" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="#E86A33" stroke-width="2" class="anim-sense-ring" stroke-dasharray="15,8" />
    
    <!-- CENTER HUB NODE -->
    <circle cx="0" cy="0" r="90" fill="#2D112C" stroke="#F5B041" stroke-width="4" />
    <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="28" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">SPIDER-SENSE</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#F5B041" text-anchor="middle">.ENGINEERING POWERS</text>
  </g>

  <!-- ASYMMETRICAL COMIC CALLOUT POWERS (ANGLED & FLOATING) -->
  <!-- POWER 1: RAG & VECTOR SEARCH (TOP LEFT) -->
  <g transform="translate(220, 160) rotate(-4)">
    <polygon points="0,0 360,0 340,110 0,110" fill="#2D112C" stroke="#F5B041" stroke-width="3" />
    <text x="20" y="32" font-family="'Impact', sans-serif" font-size="20" fill="#F5B041">🕸️ RETRIEVAL &amp; CONTEXT</text>
    <text x="20" y="60" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8">RAG Pipelines • Vector Search</text>
    <text x="20" y="85" font-family="'Courier New', monospace" font-size="13" fill="#E86A33" font-weight="700">Qdrant • PGVector • Embeddings</text>
  </g>

  <!-- POWER 2: AGENTIC WORKFLOWS (TOP RIGHT) -->
  <g transform="translate(1040, 150) rotate(3)">
    <polygon points="0,0 360,0 340,110 0,110" fill="#2D112C" stroke="#E86A33" stroke-width="3" />
    <text x="20" y="32" font-family="'Impact', sans-serif" font-size="20" fill="#E86A33">🕸️ AGENTIC WORKFLOWS</text>
    <text x="20" y="60" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8">Multi-Agent State Orchestration</text>
    <text x="20" y="85" font-family="'Courier New', monospace" font-size="13" fill="#F5B041" font-weight="700">LangGraph • LangChain • Agents</text>
  </g>

  <!-- POWER 3: LLM SYSTEMS (BOTTOM LEFT) -->
  <g transform="translate(180, 420) rotate(2)">
    <polygon points="0,0 360,0 340,110 0,110" fill="#2D112C" stroke="#54152B" stroke-width="3" />
    <text x="20" y="32" font-family="'Impact', sans-serif" font-size="20" fill="#F5F1E8">🕸️ LLM INFRASTRUCTURE</text>
    <text x="20" y="60" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8">Large Language Models &amp; Tuning</text>
    <text x="20" y="85" font-family="'Courier New', monospace" font-size="13" fill="#F5B041" font-weight="700">PyTorch • Transformers • Ollama</text>
  </g>

  <!-- POWER 4: PRODUCTION INFRASTRUCTURE (BOTTOM RIGHT) -->
  <g transform="translate(1060, 430) rotate(-3)">
    <polygon points="0,0 360,0 340,110 0,110" fill="#2D112C" stroke="#F5B041" stroke-width="3" />
    <text x="20" y="32" font-family="'Impact', sans-serif" font-size="20" fill="#F5B041">🕸️ PRODUCTION BACKEND</text>
    <text x="20" y="60" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8">High-Performance Async APIs</text>
    <text x="20" y="85" font-family="'Courier New', monospace" font-size="13" fill="#E86A33" font-weight="700">FastAPI • PostgreSQL • Docker</text>
  </g>

  <!-- DYNAMIC WEB STRANDS CONNECTING TO CALLOUTS -->
  <line x1="660" y1="280" x2="420" y2="220" stroke="#F5B041" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="940" y1="280" x2="1140" y2="210" stroke="#E86A33" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="670" y1="360" x2="440" y2="440" stroke="#54152B" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="930" y1="360" x2="1120" y2="450" stroke="#F5B041" stroke-width="2" stroke-dasharray="6,4" />
</svg>
