<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="p1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#190C1A" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#p1_bg)" />
  <rect x="20" y="20" width="1560" height="610" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- ASYMMETRICAL COMIC PROJECT PANEL FRAME -->
  <g transform="translate(40, 40)">
    <polygon points="0,0 1520,0 1470,570 0,570" fill="#070B14" stroke="#FF3040" stroke-width="5" />
    <polygon points="10,10 1505,10 1460,560 10,560" fill="none" stroke="#20D9FF" stroke-width="1.5" />

    <!-- TITLE PORTAL BADGE -->
    <rect x="40" y="35" width="580" height="65" fill="#FF3040" stroke="#070B14" stroke-width="3" />
    <text x="65" y="78" font-family="'Impact', sans-serif" font-size="38" font-weight="900" fill="#F5F2E8" letter-spacing="3">UNIVERSE 01 // MERAVYAPAR AI</text>

    <!-- UNIVERSE THEME & TAGLINE -->
    <g transform="translate(40, 115)">
      <rect x="0" y="0" width="460" height="35" fill="#FFD54A" />
      <text x="15" y="24" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#070B14">FINANCIAL INTELLIGENCE UNIVERSE</text>

      <rect x="0" y="50" width="750" height="70" fill="#0D111C" stroke="#F5F2E8" stroke-width="2" />
      <text x="25" y="92" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#20D9FF">"WHEN MONEY LEAVES CLUES, INTELLIGENT SYSTEMS SHOULD SEE THEM."</text>
    </g>

    <!-- LEFT SIDE: CONCEPT MATRIX & DESCRIPTION -->
    <g transform="translate(40, 260)">
      <text x="0" y="25" font-family="'Impact', sans-serif" font-size="22" fill="#FFD54A" letter-spacing="1">MISSION OBJECTIVE &amp; CORE ARCHITECTURE:</text>
      
      <text x="0" y="65" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">AI-powered Financial Intelligence Layer for merchants parsing fragmented</text>
      <text x="0" y="90" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">financial activity, evidence-driven transactions, and receivables intelligence.</text>

      <g transform="translate(0, 120)">
        <circle cx="15" cy="20" r="5" fill="#FF3040" />
        <text x="35" y="25" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">Financial Intelligence Graph &amp; Transaction Evidence</text>

        <circle cx="15" cy="50" r="5" fill="#20D9FF" />
        <text x="35" y="55" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">Receivables Prioritization &amp; Payment Promises</text>

        <circle cx="15" cy="80" r="5" fill="#7C3AED" />
        <text x="35" y="85" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">Agentic Financial Analysis Pipeline</text>
      </g>
    </g>

    <!-- RIGHT SIDE: VISUAL GRAPH ARTWORK & TECH SIGNALS -->
    <g transform="translate(850, 115)">
      <!-- Visual Financial Graph Node Container -->
      <rect x="0" y="0" width="580" height="340" fill="#0D111C" stroke="#20D9FF" stroke-width="2" />
      
      <!-- Nodes & Glowing Connection Strands -->
      <g opacity="0.8">
        <line x1="80" y1="80" x2="260" y2="170" stroke="#FF3040" stroke-width="2" />
        <line x1="260" y1="170" x2="480" y2="100" stroke="#20D9FF" stroke-width="2" />
        <line x1="260" y1="170" x2="350" y2="270" stroke="#7C3AED" stroke-width="2" />
        
        <circle cx="80" cy="80" r="16" fill="#FF3040" />
        <circle cx="260" cy="170" r="24" fill="#20D9FF" />
        <circle cx="480" cy="100" r="18" fill="#FFD54A" />
        <circle cx="350" cy="270" r="14" fill="#7C3AED" />

        <text x="80" y="85" font-family="'Courier New', monospace" font-size="10" fill="#070B14" font-weight="900" text-anchor="middle">TX</text>
        <text x="260" y="175" font-family="'Courier New', monospace" font-size="12" fill="#070B14" font-weight="900" text-anchor="middle">GRAPH</text>
        <text x="480" y="105" font-family="'Courier New', monospace" font-size="10" fill="#070B14" font-weight="900" text-anchor="middle">RAG</text>
      </g>

      <!-- Tech Signal Badges -->
      <g transform="translate(20, 280)">
        <rect x="0" y="0" width="110" height="35" fill="#070B14" stroke="#FF3040" stroke-width="1.5" />
        <text x="55" y="22" font-family="'Courier New', monospace" font-size="13" fill="#FF3040" text-anchor="middle">FASTAPI</text>

        <rect x="125" y="0" width="130" height="35" fill="#070B14" stroke="#20D9FF" stroke-width="1.5" />
        <text x="190" y="22" font-family="'Courier New', monospace" font-size="13" fill="#20D9FF" text-anchor="middle">LANGGRAPH</text>

        <rect x="270" y="0" width="140" height="35" fill="#070B14" stroke="#7C3AED" stroke-width="1.5" />
        <text x="340" y="22" font-family="'Courier New', monospace" font-size="13" fill="#7C3AED" text-anchor="middle">POSTGRESQL</text>

        <rect x="425" y="0" width="110" height="35" fill="#070B14" stroke="#FFD54A" stroke-width="1.5" />
        <text x="480" y="22" font-family="'Courier New', monospace" font-size="13" fill="#FFD54A" text-anchor="middle">AI AGENTS</text>
      </g>
    </g>
  </g>
</svg>
