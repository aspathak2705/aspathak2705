<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="100%" height="100%">
  <defs>
    <linearGradient id="finalSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D112C" />
      <stop offset="40%" stop-color="#6B1D38" />
      <stop offset="75%" stop-color="#C83E34" />
      <stop offset="100%" stop-color="#E86A33" />
    </linearGradient>

    <clipPath id="finalArtClip">
      <rect x="0" y="0" width="1560" height="510" />
    </clipPath>
  </defs>

  <rect width="1600" height="550" fill="url(#finalSunset)" />
  
  <!-- EMBEDDED OFFICIAL SPIDER-VERSE SUNSET WALLPAPER ARTWORK -->
  <g transform="translate(20, 20)" opacity="0.4" clip-path="url(#finalArtClip)">
    <image href="../reference/Spider Man_ Across The Spider Verse Wallpaper.svg" x="0" y="-100" width="1560" height="700" preserveAspectRatio="xMidYMid slice" />
  </g>

  <rect x="20" y="20" width="1560" height="510" fill="none" stroke="#F5F1E8" stroke-width="4" />

  <g transform="translate(800, 240)">
    <rect x="-440" y="-45" width="880" height="90" fill="#2D112C" opacity="0.95" stroke="#F2A154" stroke-width="3" />
    <text x="0" y="-8" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#F2A154" text-anchor="middle" letter-spacing="3">"Some systems answer questions."</text>
    <text x="0" y="24" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="4">"I WANT TO BUILD THE ONES THAT CHANGE WHAT HAPPENS NEXT."</text>
  </g>

  <g transform="translate(800, 420)">
    <rect x="-180" y="-20" width="360" height="40" fill="#E86A33" stroke="#2D112C" stroke-width="3" />
    <text x="0" y="6" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="4">TO BE CONTINUED...</text>
  </g>
</svg>
