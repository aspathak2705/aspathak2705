<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="100%" height="100%">
  <defs>
    <linearGradient id="mc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
  </defs>

  <rect width="1600" height="550" fill="url(#mc_bg)" />
  <rect x="20" y="20" width="1560" height="510" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="340" height="40" fill="#FFD54A" stroke="#070B14" stroke-width="2" />
    <text x="170" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#070B14" text-anchor="middle" letter-spacing="3">SCENE 06 // MISSION CONTROL</text>
  </g>

  <!-- COMMAND CENTER PANELS -->
  <g transform="translate(60, 110)">
    <polygon points="0,0 1480,0 1440,380 0,380" fill="#070B14" stroke="#FF3040" stroke-width="4" />

    <!-- LEFT: CURRENTLY BUILDING -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="660" height="300" fill="#0D111C" stroke="#20D9FF" stroke-width="2" />
      <text x="30" y="45" font-family="'Impact', sans-serif" font-size="24" fill="#FF3040" letter-spacing="2">ACTIVE BUILDING TASKS:</text>
      
      <g transform="translate(30, 80)">
        <text x="0" y="30" font-family="'Courier New', monospace" font-size="16" fill="#20D9FF" font-weight="700">→ Agentic AI Systems &amp; Multi-Agent Orchestration</text>
        <text x="0" y="70" font-family="'Courier New', monospace" font-size="16" fill="#F5F2E8" font-weight="700">→ High-Performance Vector Retrieval &amp; RAG</text>
        <text x="0" y="110" font-family="'Courier New', monospace" font-size="16" fill="#FFD54A" font-weight="700">→ Knowledge Graphs &amp; Evidence Intelligence</text>
        <text x="0" y="150" font-family="'Courier New', monospace" font-size="16" fill="#7C3AED" font-weight="700">→ Production AI Infrastructure (FastAPI / Docker)</text>
      </g>
    </g>

    <!-- RIGHT: CURRENT SIGNAL & TERMINAL SIMULATION -->
    <g transform="translate(740, 40)">
      <rect x="0" y="0" width="680" height="300" fill="#0D111C" stroke="#FFD54A" stroke-width="2" />
      <text x="30" y="45" font-family="'Impact', sans-serif" font-size="24" fill="#FFD54A" letter-spacing="2">MULTIVERSE SIGNAL:</text>

      <rect x="30" y="70" width="620" height="190" fill="#070B14" stroke="#20D9FF" stroke-width="1.5" />
      <g transform="translate(50, 100)" font-family="'Courier New', monospace" font-size="14">
        <text x="0" y="0" fill="#20D9FF">> system.initialize()</text>
        <text x="0" y="25" fill="#8B949E">> loading_agentic_context...</text>
        <text x="0" y="50" fill="#8B949E">> connecting_memory_nodes...</text>
        <text x="0" y="75" fill="#FF3040">> mission_status: BUILDING IN PRODUCTION</text>
        <text x="0" y="100" fill="#FFD54A">> signal: "Exploring how AI systems maintain context &amp; memory."</text>
      </g>
    </g>
  </g>
</svg>
