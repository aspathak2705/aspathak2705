<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0F1424" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#20D9FF" stroke-width="0.5" opacity="0.15" />
    </pattern>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3040" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#20D9FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1050" fill="url(#mapBg)" />
  <rect width="1600" height="1050" fill="url(#gridPattern)" />
  <rect width="1600" height="1050" fill="url(#hubGlow)" />
  <rect x="20" y="20" width="1560" height="1010" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- SECTION HEADER LABEL -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="340" height="40" fill="#20D9FF" stroke="#070B14" stroke-width="2" />
    <text x="170" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#070B14" text-anchor="middle" letter-spacing="3">SCENE 03 // TECH MULTIVERSE MAP</text>
  </g>

  <!-- CAPTION BANNER -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="580" height="45" fill="#070B14" stroke="#FF3040" stroke-width="2" />
    <text x="20" y="28" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#F5F2E8">"EVERY UNIVERSE NEEDS A WEB. MY WEB CONNECTS INTELLIGENCE SYSTEMS."</text>
  </g>

  <!-- ========================================================= -->
  <!-- SPIDER-WEB + NEURAL GRAPH INTERCONNECTED MAP -->
  <!-- ========================================================= -->

  <g transform="translate(800, 560)">
    <!-- Radial Web Spokes -->
    <line x1="0" y1="0" x2="-600" y2="-340" stroke="#FF3040" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="0" x2="-320" y2="-400" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="0" y2="-420" stroke="#F5F2E8" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="0" x2="360" y2="-380" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="600" y2="-300" stroke="#FF3040" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="0" x2="620" y2="120" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="440" y2="340" stroke="#FFD54A" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="0" y2="380" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="-440" y2="320" stroke="#FF3040" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="-620" y2="100" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" />

    <!-- Web Rings -->
    <polygon points="-180,-100 -90,-120 0,-130 110,-110 180,-80 190,40 130,100 0,110 -120,90 -180,30" fill="none" stroke="#20D9FF" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,3" />
    <polygon points="-390,-210 -220,-250 0,-260 240,-230 390,-180 400,80 300,220 0,240 -280,200 -390,70" fill="none" stroke="#FF3040" stroke-width="1.5" opacity="0.5" />
    <polygon points="-600,-340 -320,-400 0,-420 360,-380 600,-300 620,120 440,340 0,380 -440,320 -620,100" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.4" stroke-dasharray="10,5" />

    <!-- CENTRAL HERO CORE NODE: ATHARVA.AI PORTAL -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="95" fill="#070B14" stroke="#FF3040" stroke-width="4" />
      <circle cx="0" cy="0" r="85" fill="none" stroke="#20D9FF" stroke-width="2" stroke-dasharray="6,3" />
      <circle cx="0" cy="0" r="70" fill="#FF3040" opacity="0.15" />
      <text x="0" y="-8" font-family="'Impact', sans-serif" font-size="32" font-weight="900" fill="#F5F2E8" text-anchor="middle" letter-spacing="3">ATHARVA</text>
      <text x="0" y="26" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#20D9FF" text-anchor="middle" letter-spacing="3">.AI CORE</text>
    </g>

    <!-- DIMENSION NODES (COLOR CODED BY SYSTEM CATEGORY) -->

    <!-- CATEGORY 1: AI / AGENTS (RED DIMENSION) -->
    <g transform="translate(-600, -340)">
      <polygon points="-90,-28 90,-28 110,28 -110,28" fill="#070B14" stroke="#FF3040" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="24" fill="#F5F2E8" text-anchor="middle" letter-spacing="2">LLMs</text>
    </g>

    <g transform="translate(360, -380)">
      <rect x="-100" y="-28" width="200" height="56" fill="#070B14" stroke="#FF3040" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="22" fill="#FF3040" text-anchor="middle" letter-spacing="1">AI AGENTS</text>
    </g>

    <g transform="translate(0, -260)">
      <polygon points="0,-32 100,0 0,32 -100,0" fill="#070B14" stroke="#FFD54A" stroke-width="3" />
      <text x="0" y="7" font-family="'Impact', sans-serif" font-size="20" fill="#FFD54A" text-anchor="middle" letter-spacing="1">LANGGRAPH</text>
    </g>

    <!-- CATEGORY 2: RAG / RETRIEVAL (CYAN DIMENSION) -->
    <g transform="translate(-320, -250)">
      <rect x="-95" y="-28" width="190" height="56" fill="#070B14" stroke="#20D9FF" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle" letter-spacing="1">RAG PIPELINES</text>
    </g>

    <g transform="translate(600, -300)">
      <polygon points="-100,-28 100,-28 80,28 -120,28" fill="#070B14" stroke="#20D9FF" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#F5F2E8" text-anchor="middle" letter-spacing="1">VECTOR SEARCH</text>
    </g>

    <!-- CATEGORY 3: MEMORY / KNOWLEDGE GRAPH (PURPLE DIMENSION) -->
    <g transform="translate(-620, 100)">
      <rect x="-90" y="-28" width="180" height="56" fill="#070B14" stroke="#7C3AED" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#7C3AED" text-anchor="middle" letter-spacing="1">EMBEDDINGS</text>
    </g>

    <g transform="translate(620, 120)">
      <rect x="-95" y="-28" width="190" height="56" fill="#070B14" stroke="#7C3AED" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle" letter-spacing="1">LANGCHAIN</text>
    </g>

    <!-- CATEGORY 4: PRODUCTION & DEPLOYMENT (YELLOW DIMENSION) -->
    <g transform="translate(440, 340)">
      <polygon points="-100,-28 100,-28 80,28 -80,28" fill="#070B14" stroke="#FFD54A" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#FFD54A" text-anchor="middle" letter-spacing="1">POSTGRESQL</text>
    </g>

    <g transform="translate(0, 380)">
      <rect x="-110" y="-28" width="220" height="56" fill="#070B14" stroke="#FF3040" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#F5F2E8" text-anchor="middle" letter-spacing="2">DOCKER • CLOUD</text>
    </g>

    <g transform="translate(-440, 320)">
      <polygon points="-90,-28 90,-28 70,28 -110,28" fill="#070B14" stroke="#20D9FF" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="22" fill="#20D9FF" text-anchor="middle" letter-spacing="2">FASTAPI</text>
    </g>
  </g>

  <!-- SOUND BURST EFFECT -->
  <g transform="translate(1360, 140) rotate(14)">
    <polygon points="0,-40 25,-10 60,-35 40,5 80,20 35,40 50,80 10,50 -20,80 -25,35 -70,30 -35,-5 -60,-30 -10,-20" fill="#FFD54A" stroke="#070B14" stroke-width="3" />
    <text x="0" y="10" font-family="'Impact', sans-serif" font-size="32" font-weight="900" fill="#070B14" text-anchor="middle">THWIP!</text>
  </g>
</svg>
