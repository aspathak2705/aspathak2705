<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="p4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#1A150B" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#p4_bg)" />
  <rect x="20" y="20" width="1560" height="610" fill="none" stroke="#F2EEE6" stroke-width="4" />

  <g transform="translate(40, 40)">
    <polygon points="30,0 1520,0 1520,570 0,570" fill="#080C14" stroke="#FFD34E" stroke-width="5" />
    <polygon points="40,10 1510,10 1510,560 10,560" fill="none" stroke="#FF3045" stroke-width="1.5" />

    <!-- LEVEL 1 HERO TITLE BADGE -->
    <rect x="50" y="30" width="460" height="60" fill="#FFD34E" stroke="#080C14" stroke-width="3" />
    <text x="75" y="72" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="#080C14" letter-spacing="3">UNIVERSE 04 // AUTOHR</text>

    <!-- UNIVERSE SUBTITLE & TAGLINE -->
    <g transform="translate(50, 105)">
      <rect x="0" y="0" width="340" height="30" fill="#7C4DFF" />
      <text x="15" y="20" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#F2EEE6">WORKFLOW AUTOMATION UNIVERSE</text>

      <rect x="0" y="45" width="750" height="55" fill="#0D1117" stroke="#F2EEE6" stroke-width="1.5" />
      <text x="20" y="80" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#20D9F3">"THE BEST AUTOMATION DOESN'T FEEL AUTOMATED."</text>
    </g>

    <!-- LEVEL 2 SECTION HEADING & LEVEL 3 BODY TEXT -->
    <g transform="translate(50, 225)">
      <text x="0" y="22" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#FFD34E" letter-spacing="2">MISSION OBJECTIVE &amp; CORE ARCHITECTURE</text>
      
      <text x="0" y="55" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">AI-powered HR automation system orchestrating meeting workflows, automated</text>
      <text x="0" y="80" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">presentation generation, audio narration, and employee onboarding experiences.</text>

      <g transform="translate(0, 110)">
        <circle cx="12" cy="15" r="4" fill="#FFD34E" />
        <text x="30" y="20" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Automated Meeting &amp; Induction Workflows</text>

        <circle cx="12" cy="45" r="4" fill="#FF3045" />
        <text x="30" y="50" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">AI Presentation Generation &amp; Audio Narration</text>

        <circle cx="12" cy="75" r="4" fill="#20D9F3" />
        <text x="30" y="80" font-family="'Courier New', monospace" font-size="14" fill="#F2EEE6">Seamless Process Automation Engine</text>
      </g>
    </g>

    <!-- RIGHT SIDE: SIMPLIFIED VISUAL ARCHITECTURE -->
    <g transform="translate(860, 105)">
      <rect x="0" y="0" width="580" height="340" fill="#0D1117" stroke="#FF3045" stroke-width="2" />
      
      <g opacity="0.9">
        <rect x="60" y="70" width="200" height="130" fill="none" stroke="#FFD34E" stroke-width="2" />
        <path d="M 260,135 L 400,135" stroke="#20D9F3" stroke-width="3" stroke-dasharray="6,3" />
        <circle cx="400" cy="135" r="24" fill="#FF3045" />
        <text x="400" y="140" font-family="'Courier New', monospace" font-size="11" fill="#F2EEE6" font-weight="900" text-anchor="middle">AUTO</text>
      </g>

      <g transform="translate(30, 285)">
        <rect x="0" y="0" width="100" height="30" fill="#080C14" stroke="#FFD34E" stroke-width="1.5" />
        <text x="50" y="20" font-family="'Courier New', monospace" font-size="12" fill="#FFD34E" text-anchor="middle">PYTHON</text>

        <rect x="115" y="0" width="110" height="30" fill="#080C14" stroke="#20D9F3" stroke-width="1.5" />
        <text x="170" y="20" font-family="'Courier New', monospace" font-size="12" fill="#20D9F3" text-anchor="middle">FASTAPI</text>

        <rect x="240" y="0" width="150" height="30" fill="#080C14" stroke="#F2EEE6" stroke-width="1.5" />
        <text x="315" y="20" font-family="'Courier New', monospace" font-size="12" fill="#F2EEE6" text-anchor="middle">WORKFLOW ENGINE</text>

        <rect x="400" y="0" width="110" height="30" fill="#080C14" stroke="#7C4DFF" stroke-width="1.5" />
        <text x="455" y="20" font-family="'Courier New', monospace" font-size="12" fill="#7C4DFF" text-anchor="middle">AUDIO AI</text>
      </g>
    </g>
  </g>
</svg>
