<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="p4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#1A150B" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#p4_bg)" />
  <rect x="20" y="20" width="1560" height="610" fill="none" stroke="#F5F2E8" stroke-width="4" />

  <!-- ASYMMETRICAL COMIC PANEL -->
  <g transform="translate(40, 40)">
    <polygon points="30,0 1520,0 1520,570 0,570" fill="#070B14" stroke="#FFD54A" stroke-width="5" />
    <polygon points="40,10 1510,10 1510,560 10,560" fill="none" stroke="#FF3040" stroke-width="1.5" />

    <!-- TITLE PORTAL BADGE -->
    <rect x="50" y="35" width="480" height="65" fill="#FFD54A" stroke="#070B14" stroke-width="3" />
    <text x="75" y="78" font-family="'Impact', sans-serif" font-size="38" font-weight="900" fill="#070B14" letter-spacing="3">UNIVERSE 04 // AUTOHR</text>

    <!-- UNIVERSE THEME & TAGLINE -->
    <g transform="translate(50, 115)">
      <rect x="0" y="0" width="460" height="35" fill="#7C3AED" />
      <text x="15" y="24" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#F5F2E8">WORKFLOW AUTOMATION UNIVERSE</text>

      <rect x="0" y="50" width="750" height="70" fill="#0D111C" stroke="#F5F2E8" stroke-width="2" />
      <text x="25" y="92" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#20D9FF">"THE BEST AUTOMATION DOESN'T FEEL AUTOMATED."</text>
    </g>

    <!-- LEFT SIDE: DESCRIPTION & CONCEPTS -->
    <g transform="translate(50, 260)">
      <text x="0" y="25" font-family="'Impact', sans-serif" font-size="22" fill="#FFD54A" letter-spacing="1">MISSION OBJECTIVE &amp; CORE ARCHITECTURE:</text>
      
      <text x="0" y="65" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">AI-powered HR automation system orchestrating meeting workflows, automated</text>
      <text x="0" y="90" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">presentation generation, audio narration, and employee onboarding experiences.</text>

      <g transform="translate(0, 120)">
        <circle cx="15" cy="20" r="5" fill="#FFD54A" />
        <text x="35" y="25" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">Automated Meeting &amp; Induction Workflows</text>

        <circle cx="15" cy="50" r="5" fill="#FF3040" />
        <text x="35" y="55" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">AI Presentation Generation &amp; Audio Narration</text>

        <circle cx="15" cy="80" r="5" fill="#20D9FF" />
        <text x="35" y="85" font-family="'Courier New', monospace" font-size="15" fill="#F5F2E8">Seamless Process Automation Engine</text>
      </g>
    </g>

    <!-- RIGHT SIDE: AUTOMATION PIPELINE ARTWORK & TECH SIGNALS -->
    <g transform="translate(860, 115)">
      <rect x="0" y="0" width="580" height="340" fill="#0D111C" stroke="#FF3040" stroke-width="2" />
      
      <!-- Workflow Wave & Window Overlay -->
      <g opacity="0.8">
        <rect x="60" y="70" width="200" height="130" fill="none" stroke="#FFD54A" stroke-width="2" />
        <path d="M 260,135 L 420,135" stroke="#20D9FF" stroke-width="3" stroke-dasharray="6,3" />
        <circle cx="420" cy="135" r="24" fill="#FF3040" />
        <text x="420" y="140" font-family="'Courier New', monospace" font-size="11" fill="#F5F2E8" font-weight="900" text-anchor="middle">AUTO</text>
      </g>

      <!-- Tech Signal Badges -->
      <g transform="translate(20, 280)">
        <rect x="0" y="0" width="100" height="35" fill="#070B14" stroke="#FFD54A" stroke-width="1.5" />
        <text x="50" y="22" font-family="'Courier New', monospace" font-size="13" fill="#FFD54A" text-anchor="middle">PYTHON</text>

        <rect x="115" y="0" width="110" height="35" fill="#070B14" stroke="#20D9FF" stroke-width="1.5" />
        <text x="170" y="22" font-family="'Courier New', monospace" font-size="13" fill="#20D9FF" text-anchor="middle">FASTAPI</text>

        <rect x="240" y="0" width="160" height="35" fill="#070B14" stroke="#F5F2E8" stroke-width="1.5" />
        <text x="320" y="22" font-family="'Courier New', monospace" font-size="13" fill="#F5F2E8" text-anchor="middle">WORKFLOW ENGINE</text>

        <rect x="410" y="0" width="120" height="35" fill="#070B14" stroke="#7C3AED" stroke-width="1.5" />
        <text x="470" y="22" font-family="'Courier New', monospace" font-size="13" fill="#7C3AED" text-anchor="middle">AUDIO AI</text>
      </g>
    </g>
  </g>
</svg>
