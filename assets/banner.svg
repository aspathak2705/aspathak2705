<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <radialGradient id="redGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00A8E8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="redLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9D0B0E" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="blueLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0.2" />
    </linearGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E62429" fill-opacity="0.12" />
      <circle cx="10" cy="10" r="1.2" fill="#00A8E8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1600" height="450" fill="url(#bgGrad)" />

  <!-- Atmospheric Ambient Light -->
  <rect width="1600" height="450" fill="url(#redGlow)" />
  <rect width="1600" height="450" fill="url(#blueGlow)" />
  <rect width="1600" height="450" fill="url(#purpleGlow)" opacity="0.8" />

  <!-- Subtle Halftone Texture Layer -->
  <rect width="1600" height="450" fill="url(#halftone)" />

  <!-- LEFT REGION: Neural Graph & Abstract Web Geometry -->
  <g opacity="0.65">
    <!-- Network Connection Strands -->
    <line x1="-50" y1="80" x2="350" y2="220" stroke="#E62429" stroke-width="1" opacity="0.4" />
    <line x1="80" y1="-20" x2="280" y2="380" stroke="#00A8E8" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="350" y1="220" x2="180" y2="460" stroke="#E62429" stroke-width="1.2" opacity="0.3" />
    <line x1="280" y1="120" x2="480" y2="40" stroke="#7B2CBF" stroke-width="1" opacity="0.4" />
    <line x1="120" y1="280" x2="420" y2="240" stroke="#00A8E8" stroke-width="0.7" opacity="0.5" />

    <!-- Polygonal Mesh Triangles -->
    <polygon points="40,80 180,40 120,180" fill="#E62429" fill-opacity="0.04" stroke="#E62429" stroke-opacity="0.3" stroke-width="0.8" />
    <polygon points="120,180 280,120 220,280" fill="#00A8E8" fill-opacity="0.04" stroke="#00A8E8" stroke-opacity="0.3" stroke-width="0.8" />
    <polygon points="220,280 380,220 310,360" fill="#7B2CBF" fill-opacity="0.03" stroke="#7B2CBF" stroke-opacity="0.25" stroke-width="0.8" />

    <!-- Graph Nodes -->
    <circle cx="180" cy="40" r="3" fill="#E62429" />
    <circle cx="180" cy="40" r="7" stroke="#E62429" stroke-width="0.8" fill="none" opacity="0.6" />

    <circle cx="280" cy="120" r="3.5" fill="#00A8E8" />
    <circle cx="280" cy="120" r="9" stroke="#00A8E8" stroke-width="0.8" fill="none" opacity="0.5" />

    <circle cx="120" cy="180" r="2.5" fill="#F5F7FA" />

    <circle cx="350" cy="220" r="4" fill="#E62429" />
    <circle cx="350" cy="220" r="12" stroke="#E62429" stroke-width="0.5" stroke-dasharray="2,2" fill="none" opacity="0.7" />

    <circle cx="220" cy="280" r="3" fill="#7B2CBF" />
    <circle cx="420" cy="240" r="2.5" fill="#00A8E8" />
  </g>

  <!-- CENTER REGION: Breathing Space Frame Accents -->
  <g opacity="0.3">
    <path d="M 520,60 L 480,60 L 480,100" fill="none" stroke="#E62429" stroke-width="1.5" />
    <path d="M 1080,60 L 1120,60 L 1120,100" fill="none" stroke="#00A8E8" stroke-width="1.5" />
    <path d="M 520,390 L 480,390 L 480,350" fill="none" stroke="#00A8E8" stroke-width="1.5" />
    <path d="M 1080,390 L 1120,390 L 1120,350" fill="none" stroke="#E62429" stroke-width="1.5" />
  </g>

  <!-- RIGHT REGION: Original Dynamic Geometric Acrobat Silhouette -->
  <g transform="translate(1180, 50)">
    <!-- Motion Vector Lines & Glitch Strips -->
    <path d="M -120,60 L 180,-20" stroke="url(#redLineGrad)" stroke-width="2" />
    <path d="M -80,140 L 220,40" stroke="url(#blueLineGrad)" stroke-width="1.5" />
    <path d="M -150,220 L 150,150" stroke="#7B2CBF" stroke-width="1" stroke-dasharray="6,4" opacity="0.6" />

    <!-- Polygon Fragment Acrobat Figure (Suspended Dynamic Traversal) -->
    <!-- Head / Helmet Geometric Polygon -->
    <polygon points="140,80 160,65 175,85 155,100" fill="#F5F7FA" />
    <polygon points="160,65 175,85 180,70" fill="#00A8E8" />
    <polygon points="140,80 155,100 135,95" fill="#E62429" />

    <!-- Torso Core Facets -->
    <polygon points="110,110 145,90 155,140 120,150" fill="#07090F" stroke="#E62429" stroke-width="1.5" />
    <polygon points="145,90 170,115 155,140" fill="#9D0B0E" />
    <polygon points="120,150 155,140 135,185 105,170" fill="#0B1020" stroke="#00A8E8" stroke-width="1" />

    <!-- Extended Trailing Arm (Left) -->
    <polygon points="60,85 110,110 100,125 55,95" fill="#E62429" opacity="0.9" />
    <polygon points="15,65 60,85 55,95 10,75" fill="#00A8E8" opacity="0.8" />
    <!-- Web Thread Connected to Hand -->
    <line x1="10" y1="75" x2="-250" y2="-40" stroke="#F5F7FA" stroke-width="1.2" opacity="0.75" />

    <!-- Forward Reaching Arm (Right) -->
    <polygon points="155,100 195,120 185,135 150,115" fill="#00A8E8" />
    <polygon points="195,120 235,145 230,155 185,135" fill="#E62429" />

    <!-- Lead Dynamic Leg (Right) -->
    <polygon points="135,185 175,230 160,245 125,195" fill="#9D0B0E" />
    <polygon points="175,230 220,290 205,300 160,245" fill="#E62429" stroke="#F5F7FA" stroke-width="0.8" />

    <!-- Tucked Trailing Leg (Left) -->
    <polygon points="105,170 80,220 95,230 120,185" fill="#07090F" stroke="#00A8E8" stroke-width="1" />
    <polygon points="80,220 50,265 65,275 95,230" fill="#7B2CBF" opacity="0.85" />

    <!-- Glitch / Multiverse Debris Particles -->
    <rect x="230" y="80" width="8" height="3" fill="#E62429" opacity="0.8" />
    <rect x="-20" y="160" width="12" height="2" fill="#00A8E8" opacity="0.7" />
    <polygon points="190,260 196,255 198,263" fill="#F5F7FA" opacity="0.9" />
    <polygon points="40,210 46,204 48,212" fill="#E62429" opacity="0.8" />
  </g>

  <!-- Bottom Accent Border -->
  <line x1="0" y1="448" x2="1600" y2="448" stroke="#E62429" stroke-width="2" opacity="0.7" />
</svg>
