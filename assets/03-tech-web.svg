<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="c03_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="50%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>

    <radialGradient id="c03_centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F02B35" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#20D9FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090B10" stop-opacity="0" />
    </radialGradient>

    <pattern id="c03_dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7B2CFF" fill-opacity="0.15" />
      <circle cx="9" cy="9" r="1.2" fill="#FFD23F" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="url(#c03_bg)" />
  <rect width="1600" height="1000" fill="url(#c03_centerGlow)" />
  <rect width="1600" height="1000" fill="url(#c03_dots)" />

  <!-- Outer Comic Box Border -->
  <rect x="25" y="25" width="1550" height="950" fill="none" stroke="#F5F1E8" stroke-width="4" />
  <rect x="35" y="35" width="1530" height="930" fill="none" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />

  <!-- SECTION HEADER: CHAPTER / SCENE LABEL -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="280" height="45" fill="#7B2CFF" stroke="#090B10" stroke-width="2" />
    <text x="140" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">SCENE 03 // THE TECH WEB</text>
  </g>

  <!-- COMIC SOUND EFFECT BURST (Top Right) -->
  <g transform="translate(1320, 110) rotate(12)">
    <polygon points="0,-40 25,-10 60,-35 40,5 80,20 35,40 50,80 10,50 -20,80 -25,35 -70,30 -35,-5 -60,-30 -10,-20" fill="#FFD23F" stroke="#090B10" stroke-width="3" />
    <text x="0" y="10" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="#090B10" text-anchor="middle" letter-spacing="1">THWIP!</text>
  </g>

  <!-- CAPTION BANNER BOX -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="480" height="50" fill="#090B10" stroke="#F02B35" stroke-width="2" />
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#20D9FF" letter-spacing="2">CONNECTION ESTABLISHED. TECH MATRIX ACTIVE.</text>
  </g>

  <!-- ========================================================= -->
  <!-- SPIDER WEB GEOMETRIC GRAPH NETWORK ARCHITECTURE -->
  <!-- ========================================================= -->

  <g transform="translate(800, 520)">
    <!-- Radial Web Threads (Primary Spokes) -->
    <line x1="0" y1="0" x2="-620" y2="-320" stroke="#F02B35" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="0" x2="-350" y2="-380" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="0" y2="-400" stroke="#F5F1E8" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="0" x2="380" y2="-360" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="620" y2="-280" stroke="#F02B35" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="0" x2="650" y2="120" stroke="#7B2CFF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="480" y2="340" stroke="#FFD23F" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="0" y2="380" stroke="#20D9FF" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="-450" y2="320" stroke="#F02B35" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="-640" y2="100" stroke="#7B2CFF" stroke-width="1.5" opacity="0.6" />

    <!-- Concentric Asymmetrical Web Rings -->
    <!-- Ring 1 (Inner) -->
    <polygon points="-160,-80 -90,-100 0,-110 100,-90 160,-70 170,30 120,90 0,100 -110,80 -160,20" fill="none" stroke="#20D9FF" stroke-width="1.2" opacity="0.5" stroke-dasharray="6,3" />

    <!-- Ring 2 (Middle) -->
    <polygon points="-380,-190 -210,-230 0,-245 230,-220 370,-170 390,70 290,210 0,230 -270,190 -380,60" fill="none" stroke="#F02B35" stroke-width="1.5" opacity="0.5" />

    <!-- Ring 3 (Outer) -->
    <polygon points="-580,-300 -320,-350 0,-370 340,-330 580,-260 610,110 440,310 0,350 -410,290 -590,90" fill="none" stroke="#7B2CFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="10,5" />


    <!-- CENTER HERO HUB NODE: ATHARVA.AI -->
    <g transform="translate(0, 0)">
      <!-- Outer Pulsing Rings -->
      <circle cx="0" cy="0" r="85" fill="#090B10" stroke="#F02B35" stroke-width="4" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="#20D9FF" stroke-width="2" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="65" fill="#F02B35" opacity="0.1" />

      <!-- Center Text -->
      <text x="0" y="-8" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">ATHARVA</text>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#20D9FF" text-anchor="middle" letter-spacing="3">.AI CORE</text>
    </g>


    <!-- PERIPHERAL TECHNOLOGY NODES -->

    <!-- NODE 1: LLMs (Top Left Outer) -->
    <g transform="translate(-580, -300)">
      <polygon points="-80,-25 80,-25 100,25 -100,25" fill="#090B10" stroke="#F02B35" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="24" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">LLMs</text>
    </g>

    <!-- NODE 2: RAG ARCHITECTURE (Top Left Mid) -->
    <g transform="translate(-320, -210)">
      <rect x="-90" y="-25" width="180" height="50" fill="#090B10" stroke="#20D9FF" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle" letter-spacing="1">RAG PIPELINES</text>
    </g>

    <!-- NODE 3: LANGGRAPH (Top Inner) -->
    <g transform="translate(0, -245)">
      <polygon points="0,-30 90,0 0,30 -90,0" fill="#090B10" stroke="#FFD23F" stroke-width="3" />
      <text x="0" y="7" font-family="'Impact', sans-serif" font-size="20" fill="#FFD23F" text-anchor="middle" letter-spacing="1">LANGGRAPH</text>
    </g>

    <!-- NODE 4: AI AGENTS (Top Right Mid) -->
    <g transform="translate(340, -200)">
      <rect x="-90" y="-25" width="180" height="50" fill="#090B10" stroke="#F02B35" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#F02B35" text-anchor="middle" letter-spacing="1">AI AGENTS</text>
    </g>

    <!-- NODE 5: VECTOR SEARCH (Top Right Outer) -->
    <g transform="translate(580, -260)">
      <polygon points="-90,-25 90,-25 70,25 -110,25" fill="#090B10" stroke="#7B2CFF" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#F5F1E8" text-anchor="middle" letter-spacing="1">VECTOR SEARCH</text>
    </g>

    <!-- NODE 6: FASTAPI (Right Mid) -->
    <g transform="translate(610, 110)">
      <rect x="-80" y="-25" width="160" height="50" fill="#090B10" stroke="#00A8E8" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="22" fill="#20D9FF" text-anchor="middle" letter-spacing="2">FASTAPI</text>
    </g>

    <!-- NODE 7: POSTGRESQL (Bottom Right Outer) -->
    <g transform="translate(440, 310)">
      <polygon points="-100,-25 100,-25 80,25 -80,25" fill="#090B10" stroke="#FFD23F" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#FFD23F" text-anchor="middle" letter-spacing="1">POSTGRESQL</text>
    </g>

    <!-- NODE 8: DOCKER & CLOUD (Bottom Center) -->
    <g transform="translate(0, 350)">
      <rect x="-100" y="-25" width="200" height="50" fill="#090B10" stroke="#F02B35" stroke-width="3" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">DOCKER • CLOUD</text>
    </g>

    <!-- NODE 9: LANGCHAIN (Bottom Left Outer) -->
    <g transform="translate(-410, 290)">
      <polygon points="-90,-25 90,-25 70,25 -110,25" fill="#090B10" stroke="#20D9FF" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle" letter-spacing="1">LANGCHAIN</text>
    </g>

    <!-- NODE 10: EMBEDDINGS (Far Left Mid) -->
    <g transform="translate(-590, 90)">
      <rect x="-85" y="-25" width="170" height="50" fill="#090B10" stroke="#7B2CFF" stroke-width="2" />
      <text x="0" y="8" font-family="'Impact', sans-serif" font-size="20" fill="#7B2CFF" text-anchor="middle" letter-spacing="1">EMBEDDINGS</text>
    </g>

    <!-- Hand-Drawn Annotation Microcopy -->
    <g font-family="'Courier New', monospace" font-size="13" fill="#8B949E">
      <text x="-420" y="-120" transform="rotate(-15)">// dense vector space</text>
      <text x="220" y="-130" transform="rotate(10)">// multi-agent orchestration</text>
      <text x="260" y="190" transform="rotate(-5)">// evidence graph storage</text>
      <text x="-360" y="160" transform="rotate(12)">// stateful execution graph</text>
    </g>
  </g>

  <!-- Bottom Transition Fragment (Exiting towards Scene 04) -->
  <path d="M 0,950 Q 200,900 400,980" fill="none" stroke="#F02B35" stroke-width="3" />
  <path d="M 1200,980 Q 1400,920 1600,950" fill="none" stroke="#20D9FF" stroke-width="2" stroke-dasharray="6,4" />
</svg>
