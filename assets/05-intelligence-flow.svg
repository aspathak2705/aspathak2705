<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="100%" height="100%">
  <defs>
    <linearGradient id="c05_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>

    <pattern id="c05_dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#20D9FF" fill-opacity="0.15" />
      <circle cx="10" cy="10" r="1.5" fill="#F02B35" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="950" fill="url(#c05_bg)" />
  <rect width="1600" height="950" fill="url(#c05_dots)" />

  <!-- Outer Comic Box Border -->
  <rect x="25" y="25" width="1550" height="900" fill="none" stroke="#F5F1E8" stroke-width="4" />

  <!-- SECTION HEADER: CHAPTER / SCENE LABEL -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="380" height="45" fill="#20D9FF" stroke="#090B10" stroke-width="2" />
    <text x="190" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#090B10" text-anchor="middle" letter-spacing="3">SCENE 05 // HOW THE MIND WORKS</text>
  </g>

  <!-- CAPTION BANNER -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="620" height="45" fill="#090B10" stroke="#F02B35" stroke-width="2" />
    <text x="20" y="28" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#F5F1E8">ENGINEERING PHILOSOPHY: FROM PROMPT TO REAL-WORLD ACTION</text>
  </g>

  <!-- ========================================================= -->
  <!-- VERTICAL DIMENSIONAL SCI-FI COMIC INTELLIGENCE FLOW -->
  <!-- ========================================================= -->

  <g transform="translate(800, 200)">
    <!-- Central Energy Pipeline -->
    <line x1="0" y1="20" x2="0" y2="580" stroke="#20D9FF" stroke-width="4" />
    <line x1="0" y1="20" x2="0" y2="580" stroke="#F02B35" stroke-width="2" stroke-dasharray="10,5" />

    <!-- STAGE 1: QUESTION (Top Speech Bubble) -->
    <g transform="translate(0, 30)">
      <!-- Panel Speech Frame -->
      <polygon points="-240,-40 240,-40 260,20 220,50 -240,50" fill="#090B10" stroke="#F5F1E8" stroke-width="3" />
      <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="24" fill="#FFD23F" text-anchor="middle" letter-spacing="2">01 // THE QUESTION (INPUT)</text>
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="15" fill="#F5F1E8" text-anchor="middle">Complex query, unstructured context, ambiguous intent</text>
    </g>

    <!-- STAGE 2: CONTEXT & RETRIEVAL (Dimensional Web Pull) -->
    <g transform="translate(0, 150)">
      <!-- Left Panel: Context -->
      <g transform="translate(-320, 0)">
        <polygon points="-180,-30 180,-30 160,30 -180,30" fill="#090B10" stroke="#20D9FF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle">02A // CONTEXT HARVEST</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8" text-anchor="middle">Documents, graphs, evidence</text>
      </g>
      
      <!-- Right Panel: Retrieval -->
      <g transform="translate(320, 0)">
        <polygon points="-180,-30 180,-30 180,30 -160,30" fill="#090B10" stroke="#20D9FF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#20D9FF" text-anchor="middle">02B // VECTOR RETRIEVAL</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8" text-anchor="middle">Dense embeddings &amp; graph search</text>
      </g>
    </g>

    <!-- STAGE 3: REASONING ENGINE (Core Energy Portal) -->
    <g transform="translate(0, 290)">
      <polygon points="-280,-45 280,-45 320,45 -280,45" fill="#090B10" stroke="#F02B35" stroke-width="4" />
      <polygon points="-270,-35 270,-35 305,35 -270,35" fill="none" stroke="#7B2CFF" stroke-width="2" />
      
      <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="28" fill="#F02B35" text-anchor="middle" letter-spacing="2">03 // AGENTIC REASONING &amp; ORCHESTRATION</text>
      <text x="0" y="22" font-family="'Courier New', monospace" font-size="16" fill="#F5F1E8" text-anchor="middle">LangGraph stateful node execution &amp; multi-agent decisioning</text>
    </g>

    <!-- STAGE 4: MEMORY & TOOLS -->
    <g transform="translate(0, 420)">
      <!-- Left Panel: Memory -->
      <g transform="translate(-320, 0)">
        <polygon points="-180,-30 180,-30 160,30 -180,30" fill="#090B10" stroke="#7B2CFF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#7B2CFF" text-anchor="middle">04A // STATE &amp; MEMORY</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8" text-anchor="middle">PostgreSQL &amp; Redis checkpoints</text>
      </g>
      
      <!-- Right Panel: Tools -->
      <g transform="translate(320, 0)">
        <polygon points="-180,-30 180,-30 180,30 -160,30" fill="#090B10" stroke="#7B2CFF" stroke-width="3" />
        <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="20" fill="#7B2CFF" text-anchor="middle">04B // TOOL EXECUTION</text>
        <text x="0" y="18" font-family="'Courier New', monospace" font-size="13" fill="#F5F1E8" text-anchor="middle">APIs, databases &amp; web hooks</text>
      </g>
    </g>

    <!-- STAGE 5: REAL-WORLD ACTION (Breaking Final Frame) -->
    <g transform="translate(0, 550)">
      <polygon points="-320,-40 320,-40 340,40 -300,40" fill="#FFD23F" stroke="#090B10" stroke-width="4" />
      <text x="0" y="-5" font-family="'Impact', sans-serif" font-size="28" fill="#090B10" text-anchor="middle" letter-spacing="2">05 // REAL-WORLD ACTION &amp; RESULT</text>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#090B10" text-anchor="middle">SYSTEMS THAT ACT BEYOND THE PROMPT</text>
    </g>
  </g>

  <!-- BOTTOM NARRATIVE BANNER BOX -->
  <g transform="translate(800, 850)">
    <rect x="-420" y="-35" width="840" height="70" fill="#090B10" stroke="#F5F1E8" stroke-width="3" />
    <rect x="-412" y="-27" width="824" height="54" fill="none" stroke="#20D9FF" stroke-width="1.5" />
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="17" font-weight="900" fill="#F02B35" text-anchor="middle">"I DON'T BUILD AI TO JUST GENERATE TEXT.</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="17" font-weight="900" fill="#F5F1E8" text-anchor="middle">I BUILD SYSTEMS THAT CAN DO SOMETHING WITH IT."</text>
  </g>
</svg>
