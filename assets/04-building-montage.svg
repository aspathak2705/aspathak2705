<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="100%" height="100%">
  <defs>
    <linearGradient id="c04_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="50%" stop-color="#0F1422" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>

    <pattern id="c04_halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#F02B35" fill-opacity="0.12" />
      <circle cx="9" cy="9" r="1.5" fill="#20D9FF" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1300" fill="url(#c04_bg)" />
  <rect width="1600" height="1300" fill="url(#c04_halftone)" />

  <!-- Outer Frame -->
  <rect x="25" y="25" width="1550" height="1250" fill="none" stroke="#F5F1E8" stroke-width="4" />

  <!-- SECTION HEADER: CHAPTER / SCENE LABEL -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="360" height="45" fill="#F02B35" stroke="#090B10" stroke-width="2" />
    <text x="180" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#F5F1E8" text-anchor="middle" letter-spacing="3">SCENE 04 // BUILDING MONTAGE</text>
  </g>

  <!-- Sound Effect Annotation -->
  <g transform="translate(1380, 80) rotate(-8)">
    <polygon points="0,-30 20,-5 50,-25 30,5 60,20 25,35 35,65 5,40 -15,65 -20,30 -55,25 -25,-5 -45,-25 -5,-15" fill="#20D9FF" stroke="#090B10" stroke-width="2" />
    <text x="0" y="8" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#090B10" text-anchor="middle">ZAP!</text>
  </g>

