<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 150" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="50%" stop-color="#F5F7FA" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>
  </defs>

  <g text-anchor="middle">
    <!-- Top Geometric Framing Lines -->
    <path d="M 300,32 L 480,32 M 920,32 L 1100,32" stroke="#00A8E8" stroke-width="1.5" opacity="0.6" />
    <circle cx="480" cy="32" r="3" fill="#E62429" />
    <circle cx="920" cy="32" r="3" fill="#E62429" />

    <!-- Line 1: Secondary Subtitle -->
    <text x="700" y="36" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="700" 
          letter-spacing="10" 
          fill="#8B949E">
      YOUR FRIENDLY NEIGHBORHOOD
    </text>

    <!-- Line 2: Main Designation Title -->
    <g transform="skewX(-4)">
      <!-- Drop Shadow -->
      <text x="703" y="103" 
            font-family="Impact, 'Arial Narrow', sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="14" 
            fill="#07090F">
        AI ENGINEER
      </text>

      <!-- Main Text -->
      <text x="700" y="100" 
            font-family="Impact, 'Arial Narrow', sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="14" 
            fill="url(#blueGrad)" 
            stroke="#0B1020" 
            stroke-width="2">
        AI ENGINEER
      </text>
    </g>

    <!-- Bottom Accent Frame -->
    <path d="M 450,126 L 550,126 M 850,126 L 950,126" stroke="#E62429" stroke-width="2" opacity="0.8" />
    <polygon points="700,123 706,129 694,129" fill="#00A8E8" />
  </g>
</svg>
